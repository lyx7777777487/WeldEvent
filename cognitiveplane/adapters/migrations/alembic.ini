# Alembic configuration — Phase 1 scaffold.
#
# Phase 2 populates sqlalchemy.url from the Cognitive Plane's
# DatabaseConfig and wires the AsyncDatabaseEngine into env.py.

[alembic]
script_location = cognitiveplane/adapters/migrations
sqlalchemy.url = postgresql+asyncpg://localhost/weldevent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
