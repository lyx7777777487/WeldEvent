[project]
name = "cognitiveplane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cognitiveplane"]

[tool.setuptools.package-dir]
cognitiveplane = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
