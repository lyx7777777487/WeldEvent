# Temporal Server — 一键启动配置
# 用于 WeldEvent Control Plane 开发测试
# 访问 Web UI: http://localhost:8233

services:
  temporal:
    image: temporalio/auto-setup:1.25.0
    container_name: weldevent-temporal
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_DB=temporal
      - POSTGRES_SEEDS=postgres
      # 开发环境禁用 Elasticsearch 和 metrics
      - ENABLE_Elasticsearch=false
    ports:
      - "7233:7233"   # gRPC (Worker 连接用)
    volumes:
      - temporal-data:/var/lib/temporalio
    healthcheck:
      test: ["CMD-SHELL", "nc -z `hostname` 7233"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.32.0
    container_name: weldevent-temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000
    ports:
      - "8233:8080"
    depends_on:
      temporal:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: weldevent-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  temporal-data:
  pgdata:
