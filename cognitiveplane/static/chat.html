<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeldEvent · 焊接质检认知平面</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/mona-sans/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/jetbrains-mono/index.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* 深空黑底 — Linear 风格的克制 */
  --bg-root: #0a0a0f;
  --bg-rail: #08080c;
  --bg-panel: #0d0d14;
  --bg-elevated: #13131c;
  --bg-hover: #161620;
  --bg-active: #1f1f2e;
  --bg-bubble-user: #18181f;
  --bg-input: #0f0f17;
  --bg-card: #13131c;
  --bg-glass: rgba(15, 15, 23, 0.88);

  /* 边框 — 极简 */
  --border: #1f1f2e;
  --border-subtle: #16161f;
  --border-strong: #2a2a3c;
  --border-glow: rgba(245, 158, 11, 0.32);

  /* 文字 */
  --text-primary: #f5f5fa;
  --text-secondary: #a0a0b8;
  --text-muted: #5a5a72;
  --text-faint: #3a3a4d;

  /* 琥珀 accent — 焊接火花色，工业场景专属 */
  --accent: #f59e0b;
  --accent-2: #fbbf24;
  --accent-soft: rgba(245, 158, 11, 0.08);
  --accent-hover: rgba(245, 158, 11, 0.16);
  --accent-glow: rgba(245, 158, 11, 0.32);

  /* 状态色 — 与琥珀系协调 */
  --green: #10b981;
  --green-soft: rgba(16, 185, 129, 0.10);
  --green-glow: rgba(16, 185, 129, 0.28);
  --amber: #eab308;
  --amber-soft: rgba(234, 179, 8, 0.10);
  --amber-glow: rgba(234, 179, 8, 0.28);
  --red: #ef4444;
  --red-soft: rgba(239, 68, 68, 0.10);
  --red-glow: rgba(239, 68, 68, 0.28);
  --blue: #3b82f6;
  --blue-soft: rgba(59, 130, 246, 0.10);

  --radius-xl: 20px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 6px;
  --radius-xs: 4px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 24px rgba(245, 158, 11, 0.18);

  --font-sans: 'Mona Sans Variable', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono Variable', 'JetBrains Mono', 'SF Mono', ui-monospace, monospace;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --dur-fast: 120ms;
  --dur: 200ms;
  --dur-slow: 320ms;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg-root);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  font-size: 14.5px;
  font-weight: 450;
  font-variant-numeric: 'tabular-nums';
  letter-spacing: -0.005em;
  text-rendering: optimizeLegibility;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: var(--bg-root);
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════════════
   Layout — 极简三栏：rail(56px) + main + exec(按需)
   ══════════════════════════════════════════════ */
.app {
  display: flex;
  height: 100vh;
  position: relative;
  z-index: 1;
}

/* ── 左侧极窄 rail ── */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg-rail);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  transition: transform var(--dur-slow) var(--ease);
  z-index: 10;
  position: relative;
}

.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border-subtle);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #c2410c);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  color: #1a1a0a;
  box-shadow: 0 2px 8px rgba(245, 158, 11, 0.32);
}

.brand-name {
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.brand-ver {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  margin-left: 6px;
  padding: 1px 5px;
  border: 1px solid var(--border);
  border-radius: 3px;
}

.btn-new-chat {
  width: 100%;
  background: var(--accent-soft);
  border: 1px solid rgba(245, 158, 11, 0.2);
  color: var(--accent);
  padding: 9px 12px;
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all var(--dur) var(--ease);
}

.btn-new-chat:hover {
  background: var(--accent-hover);
  border-color: var(--accent);
}

.btn-new-chat svg { width: 14px; height: 14px; }

.sidebar-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 8px;
}

.session-date-label {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-faint);
  padding: 12px 8px 6px;
}

.session-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--dur) var(--ease);
  margin-bottom: 2px;
}

.session-row:hover { background: var(--bg-hover); }
.session-row.active { background: var(--bg-active); }
.session-row .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
}
.session-row.active .dot { background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
.session-row .title {
  flex: 1;
  font-size: 13px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.session-row.active .title { color: var(--text-primary); }
.session-row .btn-del {
  background: transparent;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  padding: 2px;
  border-radius: 4px;
  display: flex;
  opacity: 0;
  transition: all var(--dur) var(--ease);
}
.session-row:hover .btn-del { opacity: 1; }
.session-row .btn-del:hover { color: var(--red); background: var(--red-soft); }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border-subtle);
}

.status-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

.status-pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green-glow);
  animation: pulse 2.4s ease-in-out infinite;
}
.status-pulse.off { background: var(--text-faint); box-shadow: none; animation: none; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease);
  z-index: 9;
}
.sidebar-overlay.show { opacity: 1; pointer-events: auto; }

/* ── 主面板 ── */
.main-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 52px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-panel);
  flex-shrink: 0;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-menu {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px;
  border-radius: var(--radius-sm);
  display: none;
}
.btn-menu:hover { color: var(--text-primary); background: var(--bg-hover); }

.top-title {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: -0.005em;
}

.mode-selector {
  display: flex;
  gap: 2px;
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 2px;
}

.mode-pill {
  background: transparent;
  border: none;
  color: var(--text-muted);
  font-size: 11.5px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all var(--dur) var(--ease);
}
.mode-pill:hover { color: var(--text-secondary); }
.mode-pill.active { background: var(--bg-active); color: var(--text-primary); }

.top-meta {
  display: flex;
  align-items: center;
  gap: 10px;
}

.exec-toggle-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-soft);
  border: 1px solid rgba(245, 158, 11, 0.2);
  color: var(--accent);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  font-size: 11.5px;
  font-weight: 500;
  font-family: var(--font-mono);
  cursor: pointer;
  transition: all var(--dur) var(--ease);
}
.exec-toggle-btn:hover { background: var(--accent-hover); }
.exec-toggle-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
  animation: pulse 1.6s ease-in-out infinite;
}

.pill {
  font-size: 10.5px;
  font-family: var(--font-mono);
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 3px;
  letter-spacing: 0.02em;
}
.pill-fc { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(245, 158, 11, 0.2); }
.pill-so { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(59, 130, 246, 0.2); }
.pill-kw { background: var(--bg-hover); color: var(--text-muted); border: 1px solid var(--border); }

/* ── 消息区 ── */
.msg-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0;
  position: relative;
}

.msg-container {
  max-width: 780px;
  margin: 0 auto;
  padding: 32px 24px 32px;
}

/* hero 空状态 — 极简 */
.hero {
  padding: 100px 16px 60px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.hero-logo {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), #c2410c);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #1a1a0a;
  margin-bottom: 28px;
  box-shadow: 0 8px 24px rgba(245, 158, 11, 0.25), 0 0 0 1px rgba(245, 158, 11, 0.3);
}

.hero-logo svg { width: 28px; height: 28px; }

.hero h1 {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 12px;
  line-height: 1.1;
}

.hero p {
  font-size: 14px;
  color: var(--text-muted);
  letter-spacing: 0.01em;
  max-width: 480px;
  line-height: 1.6;
}

.hero .quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 36px;
  width: 100%;
  max-width: 540px;
}

.quick-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  cursor: pointer;
  text-align: left;
  transition: all var(--dur) var(--ease);
  font-family: var(--font-sans);
}
.quick-card:hover {
  border-color: var(--border-strong);
  background: var(--bg-hover);
  transform: translateY(-1px);
}
.quick-card .label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 3px;
}
.quick-card .hint {
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* 消息气泡 — Linear 风格的克制 */
.chat-msg {
  margin-bottom: 24px;
  animation: msgIn var(--dur) var(--ease-out);
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-msg .role-tag {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 6px;
}

.chat-msg .body {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--text-primary);
}

.chat-msg .body p { margin-bottom: 12px; }
.chat-msg .body p:last-child { margin-bottom: 0; }
.chat-msg .body strong { color: var(--text-primary); font-weight: 600; }
.chat-msg .body em { color: var(--text-secondary); font-style: italic; }
.chat-msg .body code {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  padding: 1px 5px;
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--accent);
}
.chat-msg .body pre {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  overflow-x: auto;
  margin: 12px 0;
}
.chat-msg .body pre code {
  background: transparent;
  border: none;
  padding: 0;
  color: var(--text-secondary);
  font-size: 12.5px;
  line-height: 1.5;
}
.chat-msg .body h1, .chat-msg .body h2, .chat-msg .body h3 {
  color: var(--text-primary);
  font-weight: 600;
  margin: 16px 0 8px;
  letter-spacing: -0.01em;
}
.chat-msg .body h1 { font-size: 18px; }
.chat-msg .body h2 { font-size: 16px; }
.chat-msg .body h3 { font-size: 14.5px; }
.chat-msg .body ul, .chat-msg .body ol { margin: 8px 0 12px 20px; }
.chat-msg .body li { margin-bottom: 4px; }
.chat-msg .body hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.chat-msg .body blockquote {
  border-left: 2px solid var(--accent);
  padding-left: 12px;
  color: var(--text-secondary);
  margin: 8px 0;
}
.chat-msg .body table {
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 13px;
  width: 100%;
}
.chat-msg .body th, .chat-msg .body td {
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: left;
}
.chat-msg .body th {
  background: var(--bg-elevated);
  font-weight: 600;
  color: var(--text-secondary);
}

/* 缩略图条 */
.thumb-strip {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.thumb-strip img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

/* 工具调用标签 */
.tool-row {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.tool-chip {
  font-size: 10.5px;
  font-family: var(--font-mono);
  font-weight: 500;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-muted);
  padding: 2px 7px;
  border-radius: 3px;
}

/* typing 指示器 */
.typing-row {
  display: flex;
  gap: 4px;
  padding: 4px 0;
}
.typing-row span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: typingDot 1.4s ease-in-out infinite;
}
.typing-row span:nth-child(2) { animation-delay: 0.2s; }
.typing-row span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingDot {
  0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-2px); }
}

/* thinking 块 — Claude Code 风格的可折叠推理过程 */
.thinking-block {
  background: transparent;
  border: 1px solid var(--border-subtle);
  border-left: 2px solid var(--text-faint);
  border-radius: var(--radius-sm);
  margin: 12px 0;
  overflow: hidden;
}
.thinking-block .think-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
  font-size: 12px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  transition: background var(--dur) var(--ease);
}
.thinking-block .think-header:hover { background: var(--bg-hover); }
.thinking-block .think-icon { width: 14px; height: 14px; opacity: 0.7; }
.thinking-block .think-label { flex: 1; }
.thinking-block .think-chev { font-size: 10px; transition: transform var(--dur) var(--ease); }
.thinking-block.collapsed .think-chev { transform: rotate(-90deg); }
.thinking-block.collapsed .think-body { display: none; }
.thinking-block .think-body {
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  border-top: 1px solid var(--border-subtle);
}

/* approval-card — 工作流启动前确认 */
.approval-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  margin: 12px 0;
  animation: msgIn var(--dur) var(--ease-out);
}
.approval-card.resolved { opacity: 0.65; border-left-color: var(--text-faint); }
.ap-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.ap-icon { width: 16px; height: 16px; color: var(--accent); }
.ap-title { font-size: 13px; font-weight: 500; color: var(--text-primary); flex: 1; }
.ap-badge {
  font-size: 10px;
  font-family: var(--font-mono);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid rgba(245, 158, 11, 0.2);
  padding: 2px 6px;
  border-radius: 3px;
}
.ap-body {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  margin-bottom: 12px;
}
.ap-actions { display: flex; gap: 8px; }
.ap-resolved-tag {
  font-size: 12px;
  font-weight: 500;
  margin-top: 6px;
}

/* 确认按钮组 */
.confirm-row, .ap-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.btn-confirm, .btn-approve {
  background: var(--accent);
  color: #1a1a0a;
  border: none;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all var(--dur) var(--ease);
}
.btn-confirm:hover, .btn-approve:hover {
  background: var(--accent-2);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px var(--accent-glow);
}

.btn-cancel, .btn-reject {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all var(--dur) var(--ease);
}
.btn-cancel:hover, .btn-reject:hover {
  background: var(--red-soft);
  color: var(--red);
  border-color: rgba(239, 68, 68, 0.3);
}

/* ══════════════════════════════════════════════
   Workflow DAG Canvas — Coze/Dify 风格的工作流编排画板
   ══════════════════════════════════════════════ */
.wf-canvas {
  position: relative;
  height: 320px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  overflow: hidden;
  display: none;
  flex-shrink: 0;
}
.wf-canvas.open { display: block; animation: canvasIn var(--dur) var(--ease-out); }
@keyframes canvasIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.wf-canvas-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-elevated);
}

.wf-canvas-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 8px;
}
.wf-canvas-title::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
}

.wf-canvas-stats {
  font-size: 11.5px;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.wf-canvas-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: flex;
  transition: all var(--dur) var(--ease);
}
.wf-canvas-close:hover { color: var(--text-primary); background: var(--bg-hover); }

.wf-canvas-body {
  position: relative;
  width: 100%;
  height: calc(100% - 41px);
  overflow: auto;
  background:
    radial-gradient(circle at 1px 1px, var(--border-subtle) 1px, transparent 0) 0 0 / 20px 20px;
}

.wf-dag-svg {
  display: block;
  min-width: 100%;
  min-height: 100%;
}

/* DAG 节点样式 */
.dag-node {
  cursor: pointer;
  transition: filter var(--dur) var(--ease);
}
.dag-node:hover { filter: brightness(1.15); }

.dag-node-rect {
  fill: var(--bg-elevated);
  stroke: var(--border-strong);
  stroke-width: 1;
  rx: 10;
  ry: 10;
  transition: all var(--dur) var(--ease);
}

/* 节点状态色 — 边框 + 微光 */
.dag-node.pending .dag-node-rect {
  stroke: var(--border-strong);
  fill: var(--bg-elevated);
}
.dag-node.running .dag-node-rect {
  stroke: var(--accent);
  stroke-width: 1.5;
  filter: drop-shadow(0 0 8px var(--accent-glow));
  animation: nodePulse 1.8s ease-in-out infinite;
}
@keyframes nodePulse {
  0%, 100% { filter: drop-shadow(0 0 6px var(--accent-glow)); }
  50% { filter: drop-shadow(0 0 14px var(--accent-glow)); }
}
.dag-node.done .dag-node-rect {
  stroke: var(--green);
  fill: var(--green-soft);
}
.dag-node.failed .dag-node-rect {
  stroke: var(--red);
  fill: var(--red-soft);
}
.dag-node.cancelled .dag-node-rect {
  stroke: var(--text-faint);
  fill: var(--bg-elevated);
  opacity: 0.5;
}

.dag-node-capability {
  fill: var(--text-muted);
  font-size: 10px;
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.dag-node-label {
  fill: var(--text-primary);
  font-size: 12.5px;
  font-weight: 500;
  font-family: var(--font-sans);
}

.dag-node-status-icon {
  font-size: 11px;
}

/* DAG 连线 */
.dag-edge {
  fill: none;
  stroke: var(--border-strong);
  stroke-width: 1.5;
  transition: stroke var(--dur) var(--ease);
}
.dag-edge.active {
  stroke: var(--accent);
  stroke-width: 2;
  filter: drop-shadow(0 0 4px var(--accent-glow));
}
.dag-edge.done {
  stroke: var(--green);
}

.dag-edge-arrow {
  fill: var(--border-strong);
  transition: fill var(--dur) var(--ease);
}
.dag-edge.active .dag-edge-arrow { fill: var(--accent); }
.dag-edge.done .dag-edge-arrow { fill: var(--green); }

/* DAG 节点详情 tooltip */
.dag-tooltip {
  position: absolute;
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  font-size: 12px;
  color: var(--text-primary);
  max-width: 280px;
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  z-index: 100;
  box-shadow: var(--shadow-lg);
}
.dag-tooltip.show { opacity: 1; transform: translateY(0); }
.dag-tooltip-title {
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text-primary);
}
.dag-tooltip-body {
  color: var(--text-secondary);
  line-height: 1.5;
  font-family: var(--font-mono);
  font-size: 11px;
}

/* ── 旧 wf-panel（保留兼容性，但默认不显示） ── */
.wf-panel {
  display: none;
}

/* ── 输入区 ── */
.input-zone {
  padding: 14px 24px 18px;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-panel);
  flex-shrink: 0;
}

.input-shell {
  max-width: 780px;
  margin: 0 auto;
}

.preview-strip {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.preview-item {
  position: relative;
  width: 56px;
  height: 56px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
}
.preview-item img { width: 100%; height: 100%; object-fit: cover; }
.preview-item .rm-btn {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(0,0,0,0.7);
  color: white;
  border: none;
  font-size: 11px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 8px 8px 8px 12px;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.input-row:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn-attach {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px;
  border-radius: var(--radius-sm);
  display: flex;
  transition: color var(--dur) var(--ease);
}
.btn-attach:hover { color: var(--text-primary); }

#chatInput {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14.5px;
  line-height: 1.5;
  resize: none;
  padding: 6px 0;
  max-height: 180px;
}
#chatInput::placeholder { color: var(--text-faint); }

.btn-fire {
  background: var(--accent);
  color: #1a1a0a;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--dur) var(--ease);
  flex-shrink: 0;
}
.btn-fire:hover {
  background: var(--accent-2);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px var(--accent-glow);
}
.btn-fire:disabled {
  background: var(--bg-hover);
  color: var(--text-faint);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.input-hint {
  font-size: 11px;
  color: var(--text-faint);
  text-align: center;
  margin-top: 8px;
  font-family: var(--font-mono);
}

/* ══════════════════════════════════════════════
   Execution Panel — 右侧浮层（保留原 ID）
   ══════════════════════════════════════════════ */
.exec-panel {
  position: fixed;
  top: 52px;
  right: 0;
  bottom: 0;
  width: 380px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform var(--dur-slow) var(--ease);
  z-index: 20;
  display: flex;
  flex-direction: column;
}
.exec-panel.open { transform: translateX(0); }

.exec-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-subtle);
}

.exec-agent-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}
.exec-agent-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
}

.exec-panel-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-exec-stop {
  background: var(--red-soft);
  border: 1px solid rgba(239, 68, 68, 0.2);
  color: var(--red);
  width: 24px;
  height: 24px;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--dur) var(--ease);
}
.btn-exec-stop:hover { background: rgba(239, 68, 68, 0.2); }

.exec-panel-stats {
  font-size: 11.5px;
  font-family: var(--font-mono);
  color: var(--text-muted);
}

.btn-exec-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 4px;
  display: flex;
  transition: all var(--dur) var(--ease);
}
.btn-exec-close:hover { color: var(--text-primary); background: var(--bg-hover); }

.exec-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
}

.exec-workflow-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 12px;
  display: none;
}

.exec-progress {
  margin-bottom: 8px;
}
.exec-progress-bar {
  height: 4px;
  background: var(--bg-input);
  border-radius: 2px;
  overflow: hidden;
}
.exec-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 2px;
  transition: width var(--dur) var(--ease);
  box-shadow: 0 0 8px var(--accent-glow);
}
.exec-progress-text {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-bottom: 16px;
}

.exec-node-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.exec-node {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  transition: all var(--dur) var(--ease);
}
.exec-node.running {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.exec-node.done {
  border-color: rgba(16, 185, 129, 0.2);
}
.exec-node.failed {
  border-color: rgba(239, 68, 68, 0.3);
  background: var(--red-soft);
}

.exec-node-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.exec-node-icon.pending { color: var(--text-faint); }
.exec-node-icon.running { color: var(--accent); }
.exec-node-icon.done { color: var(--green); }
.exec-node-icon.failed { color: var(--red); }

.exec-node-info { flex: 1; min-width: 0; }
.exec-node-label {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.exec-node-summary {
  font-size: 11px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  line-height: 1.5;
}
.exec-node-detail {
  margin-top: 6px;
  padding: 8px 10px;
  background: var(--bg-input);
  border-radius: var(--radius-xs);
  font-size: 10.5px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  white-space: pre-wrap;
  max-height: 200px;
  overflow: auto;
  border: 1px solid var(--border-subtle);
}

.exec-summary {
  margin-top: 16px;
  padding: 14px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
}
.exec-summary-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.exec-summary-text {
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* ── 响应式 ── */
@media (max-width: 900px) {
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    transform: translateX(-100%);
    box-shadow: var(--shadow-lg);
  }
  .sidebar.open { transform: translateX(0); }
  .btn-menu { display: flex; }
  .exec-panel { width: 100%; }
}

@media (max-width: 640px) {
  .hero { padding: 60px 16px 40px; }
  .hero h1 { font-size: 24px; }
  .hero .quick-grid { grid-template-columns: 1fr; }
  .msg-container { padding: 20px 16px; }
  .input-zone { padding: 10px 12px 14px; }
  .mode-selector { display: none; }
  .top-meta .pill { display: none; }
}

/* 滚动条 */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">W</div>
        <span class="brand-name">WeldEvent<span class="brand-ver">v0.2</span></span>
      </div>
      <button class="btn-new-chat" onclick="newSession()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>新对话</span>
      </button>
    </div>
    <div class="sidebar-list" id="sessionList"></div>
    <div class="sidebar-footer">
      <div class="status-line">
        <div class="status-pulse" id="statusDot"></div>
        <span id="statusText">已连接</span>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="main-panel">
    <div class="top-bar">
      <div class="top-left">
        <button class="btn-menu" onclick="toggleSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="top-title" id="chatTitle">新对话</span>
      </div>
      <div class="mode-selector" id="modeSelector">
        <button class="mode-pill active" data-mode="chat" onclick="switchMode('chat')">对话</button>
        <button class="mode-pill" data-mode="batch" onclick="switchMode('batch')">批量</button>
        <button class="mode-pill" data-mode="live" onclick="switchMode('live')">实时</button>
      </div>
      <div class="top-meta">
        <button class="exec-toggle-btn" id="execToggleBtn" onclick="openExecPanel()" style="display:none" title="打开执行监控面板">
          <span class="exec-toggle-dot"></span>
          <span id="execToggleLabel"></span>
        </button>
        <span id="toolsCount" style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);font-weight:500"></span>
        <span class="pill pill-fc" id="tierBadge" style="display:none"></span>
      </div>
    </div>

    <div class="msg-scroll" id="msgScroll">
      <div class="msg-container" id="msgContainer">
        <div class="hero" id="hero">
          <div class="hero-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5m-9.25-11.396c.251.023.501.05.75.082M19 14.5l-3.091-3.091a2.25 2.25 0 01-.659-1.591V3.186m0 0a24.3 24.3 0 00-4.5 0"/></svg>
          </div>
          <h1>WeldEvent Cognitive Plane</h1>
          <p>焊接质检智能决策引擎 · 标准查询 · 案例检索 · 工艺参数 · 工作流编排 · 焊缝图像分析</p>
          <div class="quick-grid">
            <button class="quick-card" onclick="sendQuick('查询NB/T47014标准中关于预热温度的规定')">
              <div class="label">查询焊接标准</div>
              <div class="hint">NB/T 47014</div>
            </button>
            <button class="quick-card" onclick="sendQuick('查询GMAW焊接的工艺参数')">
              <div class="label">查询工艺参数</div>
              <div class="hint">GMAW 焊接</div>
            </button>
            <button class="quick-card" onclick="sendQuick('查找类似的夹渣缺陷处理案例')">
              <div class="label">检索历史案例</div>
              <div class="hint">夹渣缺陷</div>
            </button>
            <button class="quick-card" onclick="sendQuick('请设计一个完整的焊缝质检工作流')">
              <div class="label">设计工作流</div>
              <div class="hint">IQA + PPA + 检测</div>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 工作流 DAG 画板 — 工作流敲定时展开 -->
    <div class="wf-canvas" id="wfCanvas">
      <div class="wf-canvas-header">
        <span class="wf-canvas-title">工作流编排</span>
        <span class="wf-canvas-stats" id="wfCanvasStats"></span>
        <button class="wf-canvas-close" onclick="closeWfCanvas()" title="收起画板">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="wf-canvas-body" id="wfCanvasBody">
        <svg class="wf-dag-svg" id="wfDagSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="dag-tooltip" id="dagTooltip"></div>
      </div>
    </div>

    <!-- 旧 wf-panel 容器（保留 ID 给原 JS 用，但默认隐藏） -->
    <div class="wf-panel" id="wfPanel">
      <div class="wf-panel-inner">
        <div class="wf-header">
          <span class="wf-title" id="wfTitle">处理进度</span>
          <span class="wf-stats" id="wfStats"></span>
        </div>
        <div class="wf-progress-bar"><div class="wf-progress-fill" id="wfProgressFill" style="width:0%"></div></div>
        <div class="wf-card-strip" id="wfCardStrip"></div>
      </div>
    </div>

    <div class="input-zone">
      <div class="input-shell">
        <div class="preview-strip" id="imagePreview"></div>
        <div class="input-row">
          <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="上传文件">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="fileInput" accept="image/*,.pdf,.docx,.xlsx,.xls,.csv,.zip" multiple style="display:none" onchange="handleFiles(this.files)">
          <textarea id="chatInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="btn-fire" id="sendBtn" onclick="sendMessage()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
          <button class="btn-fire btn-stop" id="stopBtn" onclick="stopChat()" style="display:none;background:var(--red,#e74c3c);color:#fff;" title="中断当前对话">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
        <div class="input-hint">支持图片 / PDF / Word / Excel / CSV / ZIP 上传</div>
      </div>
    </div>
  </div>

  <div class="exec-panel" id="execPanel">

<script>
// 同源相对路径 — 避免浏览器代理拦截 127.0.0.1 的绝对 URL 请求
const API_BASE = '/api/v1';

let sessions = JSON.parse(localStorage.getItem('we_sessions') || '[]');
let currentSessionId = null;
let isLoading = false;
let pendingImages = [];
let pendingFileList = [];

let wfCards = [];
let wfExpandedCard = null;

// ── 执行监控面板状态 ──
let execNodes = [];
let execPanelOpen = false;
let execRunCompleted = false;
let execActiveWorkflowId = null;
let activeAbortController = null;
// ── AgentLoop WebSocket 连接 ──
// 替代 HTTP /stream,启用 AgentLoop 的中断 + 反馈能力。
// 全局一个连接,跨会话复用,session_id 在消息里带。
let chatWs = null;
let chatWsReady = false;
// 当前流式消息的上下文 — onmessage 回调需要知道往哪条消息追加 token
let activeStreamSession = null;
let activeStreamMsg = null;
// Promise 控制 — sendStreamMessage 阻塞到 final 事件到达
let activeStreamPromise = null;
let activeStreamResolve = null;
let activeStreamReject = null;
// P1-7: 工作流节点事件 EventSource — 长连接订阅 L2→L1 节点事件
// 在 switchSession 时启动,switchSession 切走时关闭。监听 L2 emit 的
// node_start/node_end/workflow_completed 等事件,实时更新 execPanel。
let workflowEventSource = null;

// ── Workflow DAG 状态 ──
// 当 design_workflow 返回 nodes 列表后，记录节点和依赖关系到此处。
// handleWorkflowEvent 收到 node_start/node_end 时同步更新 dagNodeStates。
let dagNodes = [];        // [{node_id, capability, action, depends_on:[]}]
let dagNodeStates = {};   // {node_id: 'pending'|'running'|'done'|'failed'|'cancelled'}
let dagEdges = [];        // [{from: node_id, to: node_id}]
let dagPositions = {};    // {node_id: {x, y}} — 自动布局缓存

let currentMode = 'chat';

// 工具名 → 用户可读的描述（tool_call 气泡用）
const TOOL_LABELS = {
  analyze_image: '正在分析图片...',
  search_standards: '正在查询焊接标准...',
  search_cases: '正在检索历史案例...',
  read_weldmap: '正在读取案例信息...',
  design_workflow: '正在编排质检工作流...',
  launch_workflow: '正在启动工作流...',
  request_confirmation: '等待用户确认...',
  escalate: '正在请求人工介入...',
  web_search: '正在搜索相关资料...',
};
function toolLabel(name) { return TOOL_LABELS[name] || `正在执行 ${name}...`; }

// 工具结果 → 用户可读的摘要（tool_result 气泡用）
function toolResultSummary(toolName, result, error) {
  if (error) {
    // 常见错误翻译
    if (error.includes('image_ref not found')) return '图片已过期，请重新上传';
    if (error.includes('timeout')) return '操作超时，请重试';
    // 不截断 — LLM 和用户都需要看到完整错误信息才能正确判断原因
    // (如 "version_id 缺失" vs "权限不足" vs "网络错误" 处理方式完全不同)
    return `失败: ${error}`;
  }
  const out = result?.output || {};
  switch (toolName) {
    case 'analyze_image':
      return '分析完成，见上方报告';
    case 'search_standards':
      return out.total_count ? `找到 ${out.total_count} 条相关标准` : '查询完成';
    case 'search_cases':
      return out.total_count ? `找到 ${out.total_count} 个类似案例` : '查询完成';
    case 'read_weldmap':
      return '案例信息已加载';
    case 'design_workflow':
      return out.workflow_id ? `方案已生成 (${out.node_count || '?'} 个节点)` : '方案已生成';
    case 'launch_workflow':
      if (out.status === 'COMPLETED') return '工作流执行完成';
      if (out.status === 'RUNNING') return '工作流执行中...';
      if (out.accepted) return '工作流已提交';
      return `启动失败: ${out.error || '未知错误'}`;
    case 'request_confirmation':
      return '等待用户确认';
    case 'escalate':
      return '已通知人工处理';
    case 'web_search':
      return out.total_count ? `搜索到 ${out.total_count} 条结果` : '搜索完成';
    default:
      return '完成';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  renderSessions();
  if (sessions.length > 0) switchSession(sessions[0].id);
  document.getElementById('chatInput').focus();
  connectNotificationWs();
});

async function checkHealth() {
  try {
    const r = await fetch(`${API_BASE}/health`);
    const d = await r.json();
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (d.status === 'ok') { dot.className = 'status-pulse'; txt.textContent = '已连接 · v' + d.version; }
    else { dot.className = 'status-pulse off'; txt.textContent = '异常'; }
  } catch {
    document.getElementById('statusDot').className = 'status-pulse off';
    document.getElementById('statusText').textContent = '未连接';
  }
}

function saveSessions() { localStorage.setItem('we_sessions', JSON.stringify(sessions)); }

function newSession() {
  const s = { id: 'sess_' + Date.now(), title: '新对话', messages: [], createdAt: Date.now() };
  sessions.unshift(s); saveSessions();
  switchSession(s.id); renderSessions();
  document.getElementById('chatInput').focus();
}

function switchSession(id) {
  currentSessionId = id; renderSessions(); renderMessages();
  const s = sessions.find(x => x.id === id);
  document.getElementById('chatTitle').textContent = s ? s.title : '新对话';
  updateMeta(s);
  // 窄屏选中会话后自动收起 sidebar
  closeSidebar();
  resetExecPanel();
  closeWfCanvas();
  // P1-7: 启动工作流节点事件 EventSource — 长连接订阅 L2→L1 节点事件
  startWorkflowEventStream(id);
}

// P1-7: 订阅 L2→L1 工作流节点事件流(SSE)
function startWorkflowEventStream(sessionId) {
  if (workflowEventSource) {
    workflowEventSource.close();
    workflowEventSource = null;
  }
  if (!sessionId) return;
  try {
    const url = `${API_BASE}/chat/workflow/stream/${sessionId}`;
    workflowEventSource = new EventSource(url);
    workflowEventSource.onmessage = (ev) => {
      try {
        const evt = JSON.parse(ev.data);
        handleWorkflowEvent(evt);
      } catch (e) {}
    };
    workflowEventSource.onerror = (e) => {
      console.debug('[workflow SSE] error (will auto-reconnect)', e);
    };
  } catch (e) {
    console.warn('[workflow SSE] start failed:', e);
  }
}

// P1-7: 处理 L2 推送的工作流节点事件 — 更新 execPanel + DAG 画板
function handleWorkflowEvent(evt) {
  if (!evt || !evt.event_type) return;
  const wfId = evt.workflow_id;
  const nodeId = evt.node_id;
  const type = evt.event_type;

  if (type === 'workflow_started') {
    if (!execActiveWorkflowId) {
      execActiveWorkflowId = wfId;
      openExecPanel();
      document.getElementById('execWorkflowTitle').textContent = `工作流 ${wfId}`;
      document.getElementById('execWorkflowTitle').style.display = 'block';
    }
    return;
  }

  if (type === 'node_start' && nodeId) {
    let node = execNodes.find(n => n.node_id === nodeId);
    if (!node) {
      execNodes.push({
        node_id: nodeId,
        label: nodeId,
        status: 'running',
        summary: '',
        data: null,
      });
    } else if (node.status === 'pending') {
      node.status = 'running';
    }
    dagNodeStates[nodeId] = 'running';
    renderExecNodes();
    updateExecProgress();
    renderDagGraph();
    openExecPanel();
    return;
  }

  if (type === 'node_end' && nodeId) {
    let node = execNodes.find(n => n.node_id === nodeId);
    if (!node) {
      node = { node_id: nodeId, label: nodeId, status: 'done', summary: '', data: null };
      execNodes.push(node);
    }
    const status = (evt.node_status || '').toUpperCase();
    if (status === 'OK' || status === 'MARGINAL') {
      node.status = 'done';
      dagNodeStates[nodeId] = 'done';
    } else {
      node.status = 'failed';
      dagNodeStates[nodeId] = 'failed';
    }
    node.data = evt.node_data || {};
    if (evt.error) node.data._error = evt.error;
    node.summary = summarizeNodeData(node.data, status);
    const nextPending = execNodes.find(n => n.status === 'pending');
    if (nextPending) {
      nextPending.status = 'running';
      dagNodeStates[nextPending.node_id] = 'running';
    }
    renderExecNodes();
    updateExecProgress();
    renderDagGraph();
    return;
  }

  if (type === 'workflow_completed' || type === 'workflow_failed') {
    execRunCompleted = true;
    if (type === 'workflow_failed' && evt.error) {
      const summaryEl = document.getElementById('execSummary');
      if (summaryEl) {
        summaryEl.style.display = 'block';
        summaryEl.innerHTML = `<div class="exec-summary-title" style="color:var(--red)">工作流失败</div><div class="exec-summary-text">${escHtml(evt.error)}</div>`;
      }
    }
    updateExecProgress();
    return;
  }

  if (type === 'workflow_paused') {
    const statsEl = document.getElementById('execPanelStats');
    if (statsEl) statsEl.textContent = '⏸ 已暂停';
    return;
  }
  if (type === 'workflow_resumed') {
    const statsEl = document.getElementById('execPanelStats');
    if (statsEl) statsEl.textContent = '▶ 已恢复';
    return;
  }
}

function summarizeNodeData(data, status) {
  if (!data || typeof data !== 'object') return '';
  const parts = [];
  if (data.defects !== undefined) parts.push(`缺陷:${data.defects}`);
  if (data.score !== undefined) parts.push(`评分:${data.score}`);
  if (data.confidence !== undefined) parts.push(`置信度:${data.confidence}`);
  if (data.status) parts.push(`状态:${data.status}`);
  if (data.mock) parts.push('⚠️MOCK');
  if (data._error) parts.push(`错误:${String(data._error).slice(0, 60)}`);
  if (parts.length === 0) {
    const keys = Object.keys(data).filter(k =>
      !['image_b64', 'image_path', 'raw_image'].includes(k)
    ).slice(0, 3);
    for (const k of keys) {
      const v = data[k];
      if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') {
        parts.push(`${k}:${v}`);
      }
    }
  }
  return parts.slice(0, 4).join(' · ');
}

function deleteSession(id, e) {
  e.stopPropagation();
  sessions = sessions.filter(x => x.id !== id); saveSessions();
  if (currentSessionId === id) { currentSessionId = sessions.length > 0 ? sessions[0].id : null; renderMessages(); }
  renderSessions();
}

function renderSessions() {
  const el = document.getElementById('sessionList');
  if (!sessions.length) {
    el.innerHTML = '<div style="padding:32px 16px;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.8">暂无对话<br><span style="font-size:12px;opacity:.7">点击上方按钮开始</span></div>';
    return;
  }
  const today = [], older = [];
  const now = Date.now();
  sessions.forEach(s => (now - s.createdAt < 864e5 ? today : older).push(s));
  let h = '';
  if (today.length) { h += '<div class="session-date-label">今天</div>'; today.forEach(s => h += sessionRow(s)); }
  if (older.length) { h += '<div class="session-date-label">更早</div>'; older.forEach(s => h += sessionRow(s)); }
  el.innerHTML = h;
}

function sessionRow(s) {
  const cls = s.id === currentSessionId ? ' active' : '';
  return `<div class="session-row${cls}" onclick="switchSession('${s.id}')">
    <div class="dot"></div><span class="title">${escHtml(s.title)}</span>
    <button class="btn-del" onclick="deleteSession('${s.id}', event)" title="删除">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>`;
}

function renderMessages() {
  const container = document.getElementById('msgContainer');
  const s = sessions.find(x => x.id === currentSessionId);
  if (!s || !s.messages.length) { container.innerHTML = ''; container.appendChild(makeHero()); return; }
  container.innerHTML = s.messages.map(m => msgHTML(m)).join('');
  scrollDown();
}

function makeHero() {
  const el = document.createElement('div');
  el.className = 'hero'; el.id = 'hero';
  el.innerHTML = `<div class="hero-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5m-9.25-11.396c.251.023.501.05.75.082M19 14.5l-3.091-3.091a2.25 2.25 0 01-.659-1.591V3.186m0 0a24.3 24.3 0 00-4.5 0"/></svg></div><h1>WeldEvent Cognitive Plane</h1><p>焊接质检智能决策引擎 · 标准查询 · 案例检索 · 工艺参数 · 工作流编排 · 焊缝图像分析</p><div class="quick-grid"><button class="quick-card" onclick="sendQuick('查询NB/T47014标准中关于预热温度的规定')"><div class="label">查询焊接标准</div><div class="hint">NB/T 47014</div></button><button class="quick-card" onclick="sendQuick('查询GMAW焊接的工艺参数')"><div class="label">查询工艺参数</div><div class="hint">GMAW 焊接</div></button><button class="quick-card" onclick="sendQuick('查找类似的夹渣缺陷处理案例')"><div class="label">检索历史案例</div><div class="hint">夹渣缺陷</div></button><button class="quick-card" onclick="sendQuick('请设计一个完整的焊缝质检工作流')"><div class="label">设计工作流</div><div class="hint">IQA + PPA + 检测</div></button></div>`;
  return el;

function msgHTML(m) {
  if (m.is_progress) return m.prog_html || '';
  if (m.is_thinking) {
    const body = renderMarkdown(m.content || '');
    const iter = m.iteration ? ` · 第 ${m.iteration} 轮推理` : '';
    return `<div class="thinking-block">
      <div class="think-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <svg class="think-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
        <span class="think-label">思考过程${iter}</span>
        <span class="think-chev">▾</span>
      </div>
      <div class="think-body">${body}</div>
    </div>`;
  }
  if (m.is_approval) {
    const summary = renderMarkdown(m.summary || '');
    const label = toolLabel(m.tool);
    const resolved = m.resolved;
    // 按 tool_name 动态生成按钮文案 — 避免所有工具都用"确认启动工作流"
    const approvalTexts = {
      launch_workflow:    { approve: '确认启动', reject: '取消', title: '确认启动工作流', resolvedOk: '✓ 已确认，工作流正在启动…' },
      create_job:         { approve: '确认创建', reject: '取消', title: '确认创建标注作业', resolvedOk: '✓ 已确认，作业正在创建…' },
      upload_images:      { approve: '确认上传', reject: '取消', title: '确认上传图片', resolvedOk: '✓ 已确认，图片正在上传…' },
      create_task:        { approve: '确认创建', reject: '取消', title: '确认创建标注任务', resolvedOk: '✓ 已确认，任务正在创建…' },
      trigger_ai:         { approve: '确认触发', reject: '取消', title: '确认触发AI预标注', resolvedOk: '✓ 已确认，AI预标注正在触发…' },
      assign_task:        { approve: '确认分配', reject: '取消', title: '确认分配标注任务', resolvedOk: '✓ 已确认，任务正在分配…' },
      request_confirmation: { approve: '确认', reject: '取消', title: '请确认', resolvedOk: '✓ 已确认' },
      escalate:           { approve: '同意介入', reject: '拒绝', title: '确认人工介入', resolvedOk: '✓ 已同意人工介入' },
    };
    const tx = approvalTexts[m.tool] || { approve: '确认', reject: '取消', title: '请确认', resolvedOk: '✓ 已确认' };
    const resolvedTag = resolved === 'approved'
      ? `<div class="ap-resolved-tag" style="color: var(--green);">${tx.resolvedOk}</div>`
      : resolved === 'rejected'
      ? '<div class="ap-resolved-tag" style="color: var(--red);">✗ 已拒绝，已通知智能体调整方案</div>'
      : '';
    const actions = resolved ? '' : `
      <div class="ap-actions">
        <button class="btn-approve" onclick="approveTool('${escHtml(m.approval_id)}', 'approved')">${tx.approve}</button>
        <button class="btn-reject" onclick="approveTool('${escHtml(m.approval_id)}', 'rejected')">${tx.reject}</button>
      </div>`;
    return `<div class="approval-card ${resolved ? 'resolved' : ''}">
      <div class="ap-header">
        <svg class="ap-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
        <span class="ap-title">${tx.title} · ${escHtml(label)}</span>
        <span class="ap-badge">需确认</span>
      </div>
      <div class="ap-body">${summary || '<em>（无方案摘要）</em>'}</div>
      ${actions}${resolvedTag}
    </div>`;
  }
  const isUser = m.role === 'user';
  const role = isUser ? '你' : 'Volcano';
  let imgs = '';
  if (isUser && m.images && m.images.length) {
    imgs = '<div class="thumb-strip">' + m.images.map(src => `<img src="${escHtml(src)}">`).join('') + '</div>';
  }
  let tools = '';
  if (!isUser && m.tools_used && m.tools_used.length) {
    tools = '<div class="tool-row">' + m.tools_used.map(t => `<span class="tool-chip">${escHtml(t)}</span>`).join('') + '</div>';
  }
  const body = isUser ? escHtml(m.content) : renderMarkdown(m.content);
  return `<div class="chat-msg"><div class="role-tag">${role}</div>${imgs}<div class="body">${body}</div>${tools}</div>`;
}

function confirmWorkflow() {
  const input = document.getElementById('chatInput');
  input.value = '确认启动工作流。请直接使用 launch_workflow 工具启动之前设计的工作流，无需再次确认。';
  sendMessage();
}
function cancelWorkflow() {
  const input = document.getElementById('chatInput');
  input.value = '取消工作流启动。';
  sendMessage();
}

async function approveTool(approvalId, decision) {
  try {
    const r = await fetch(`${API_BASE}/chat/approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approval_id: approvalId, decision: decision }),
    });
    const data = await r.json();
    if (!data.ok) {
      console.warn('[approve] failed:', data.error);
      return;
    }
    const s = sessions.find(x => x.id === currentSessionId);
    if (!s) return;
    for (let i = s.messages.length - 1; i >= 0; i--) {
      const m = s.messages[i];
      if (m.is_approval && m.approval_id === approvalId) {
        m.resolved = decision;
        break;
      }
    }
    renderMessages();
  } catch (err) {
    console.error('[approve] error:', err);
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isLoading) return;
  if (!currentSessionId) newSession();
  const s = sessions.find(x => x.id === currentSessionId);
  if (!s) return;

  const fc = pendingFileList.length;
  s.messages.push({ role: 'user', content: text, images: pendingImages.length ? [...pendingImages] : undefined, fileCount: fc || undefined });
  if (s.messages.length === 1) { s.title = text.slice(0, 30) + (text.length > 30 ? '...' : ''); renderSessions(); }

  input.value = ''; input.style.height = 'auto';
  document.getElementById('imagePreview').innerHTML = '';
  renderMessages(); showTyping();
  isLoading = true;
  document.getElementById('sendBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = '';

  try {
    if (fc > 0) {
      const fd = new FormData(); fd.append('message', text); fd.append('session_id', s.id);
      pendingFileList.forEach(f => fd.append('files', f));
      const r = await fetch(`${API_BASE}/chat/upload`, { method: 'POST', body: fd }); const data = await r.json();
      hideTyping();
      s.messages.push({ role: 'assistant', content: data.error ? `**错误**: ${data.error}` : (data.reply || '(空回复)'), tools_used: data.tools_used || [], tier: data.tier });
      updateMeta(s, data);
    } else {
      await sendStreamMessage(text, s);
    }
  } catch (err) {
    hideTyping();
    s.messages.push({ role: 'assistant', content: `**连接失败**: ${err.message}`, tools_used: [] });
  } finally {
    pendingImages = []; pendingFileList = [];
  }
  isLoading = false;
  document.getElementById('sendBtn').style.display = '';
  document.getElementById('stopBtn').style.display = 'none';
  saveSessions(); renderMessages(); scrollDown();
  input.focus();
}

// 中断当前对话 — 优先 AgentLoop interrupt,回退 HTTP abort
function stopChat() {
  // 优先 AgentLoop WebSocket 中断
  if (sendInterrupt()) {
    console.log('Interrupt sent via AgentLoop WebSocket');
    // 标记当前流式消息结束 (AgentLoop 收到 interrupt 会 cancel react_task,
    // 可能不会再推 final 事件,所以前端主动结束)
    if (activeStreamMsg && activeStreamMsg.streaming) {
      activeStreamMsg.streaming = false;
      if (!activeStreamMsg.content) activeStreamMsg.content = '(已中断)';
    }
    isLoading = false;
    document.getElementById('sendBtn').style.display = '';
    document.getElementById('stopBtn').style.display = 'none';
    hideTyping();
    renderMessages();
    // resolve Promise 让 sendStreamMessage 返回
    const resolveFn = activeStreamResolve;
    activeStreamSession = null;
    activeStreamMsg = null;
    activeStreamPromise = null;
    activeStreamResolve = null;
    activeStreamReject = null;
    if (resolveFn) resolveFn();
    return;
  }
  // 回退: HTTP /stream abort
  if (activeAbortController) {
    activeAbortController.abort();
    activeAbortController = null;
  }
  // 标记当前流式消息结束
  const s = sessions.find(x => x.id === currentSessionId);
  if (s) {
    const streamingMsg = s.messages.findLast(m => m.streaming);
    if (streamingMsg) {
      streamingMsg.streaming = false;
      if (!streamingMsg.content) streamingMsg.content = '(已中断)';
    }
  }
  isLoading = false;
  document.getElementById('sendBtn').style.display = '';
  document.getElementById('stopBtn').style.display = 'none';
  hideTyping();
  renderMessages();
}

async function sendStreamMessage(text, s) {
  // AgentLoop WebSocket 路径 — 替代 HTTP /stream
  // 首次调用时建立 WebSocket 连接,后续复用。
  if (!chatWs || chatWs.readyState !== WebSocket.OPEN) {
    await connectChatWs();
    if (!chatWsReady) {
      // 连接失败,回退到 HTTP /stream
      console.warn('Chat WebSocket connection failed, falling back to HTTP /stream');
      return sendStreamMessageHttp(text, s);
    }
  }

  const assistantMsg = { role: 'assistant', content: '', tools_used: [], streaming: true };
  s.messages.push(assistantMsg);
  hideTyping();
  renderMessages();

  // 记录当前流式上下文 — onmessage 回调用
  activeStreamSession = s;
  activeStreamMsg = assistantMsg;

  // 创建 Promise — 在 handleChatWsMessage 收到 final/error 事件时 resolve
  // 这样 sendStreamMessage 阻塞到 LLM 回复完成,sendMessage 的 finally 不会提前执行
  activeStreamPromise = new Promise((resolve, reject) => {
    activeStreamResolve = resolve;
    activeStreamReject = reject;
  });

  // 发送 chat 消息到 AgentLoop
  chatWs.send(JSON.stringify({
    type: 'chat',
    message: text,
    session_id: s.id,
  }));

  // 阻塞等待 final 事件
  await activeStreamPromise;
}

// HTTP /stream 回退路径 — WebSocket 连接失败时用
async function sendStreamMessageHttp(text, s) {
  const controller = new AbortController();
  activeAbortController = controller;

  try {
    const r = await fetch(`${API_BASE}/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: s.id }),
      signal: controller.signal,
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);

    const assistantMsg = { role: 'assistant', content: '', tools_used: [], streaming: true };
    s.messages.push(assistantMsg);
    hideTyping();
    renderMessages();

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        let event;
        try { event = JSON.parse(line.slice(6)); } catch { continue; }
        handleStreamEvent(event, s, assistantMsg);
      }
    }
    if (assistantMsg.streaming) {
      assistantMsg.streaming = false;
      if (!assistantMsg.content) assistantMsg.content = '(空回复)';
      renderMessages();
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      const assistantMsg = s.messages.findLast(m => m.streaming);
      if (assistantMsg) {
        assistantMsg.streaming = false;
        if (!assistantMsg.content) assistantMsg.content = '(已停止)';
      }
      renderMessages();
    } else {
      throw err;
    }
  } finally {
    activeAbortController = null;
  }
}

// ── AgentLoop WebSocket 连接管理 ──
function connectChatWs() {
  return new Promise((resolve) => {
    if (chatWs && chatWs.readyState === WebSocket.OPEN) {
      chatWsReady = true;
      resolve();
      return;
    }
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${window.location.host}${API_BASE}/chat/ws`;
    chatWs = new WebSocket(wsUrl);

    chatWs.onopen = () => {
      console.log('Chat WebSocket (AgentLoop) connected');
      chatWsReady = true;
      resolve();
    };

    chatWs.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        handleChatWsMessage(msg);
      } catch (e) {
        console.error('Failed to parse chat WS message:', e);
      }
    };

    chatWs.onclose = () => {
      console.log('Chat WebSocket closed');
      chatWsReady = false;
      chatWs = null;
      // 流式消息标记为结束
      if (activeStreamMsg && activeStreamMsg.streaming) {
        activeStreamMsg.streaming = false;
        if (!activeStreamMsg.content) activeStreamMsg.content = '(连接已断开)';
        renderMessages();
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        hideTyping();
      }
      activeStreamSession = null;
      activeStreamMsg = null;
      // 自动重连 (3秒后)
      setTimeout(() => {
        if (!chatWs) connectChatWs();
      }, 3000);
    };

    chatWs.onerror = (error) => {
      console.error('Chat WebSocket error:', error);
      chatWsReady = false;
      resolve(); // 连接失败也 resolve,让 sendStreamMessage 回退到 HTTP
    };

    // 连接超时 (3秒)
    setTimeout(() => {
      if (!chatWsReady) resolve();
    }, 3000);
  });
}

// 处理 AgentLoop 推送的消息
function handleChatWsMessage(msg) {
  // final 事件 (stream 模式: {event: "final", data: {...}}, 非 stream: {type: "final", ...})
  // 优先判断 — 避免被 handleStreamEvent 分支拦截
  if ((msg.type === 'final' || msg.event === 'final') && activeStreamMsg) {
    if (msg.event === 'final') {
      // stream 模式: 让 handleStreamEvent 处理 final 事件的 data (含 reply/tools_used)
      handleStreamEvent(msg, activeStreamSession, activeStreamMsg);
    } else {
      // 非 stream 模式: 直接填充
      if (msg.reply && !activeStreamMsg.content) activeStreamMsg.content = msg.reply;
      if (msg.tools_used) activeStreamMsg.tools_used = msg.tools_used;
      if (msg.tier) activeStreamMsg.tier = msg.tier;
    }
    activeStreamMsg.streaming = false;
    if (!activeStreamMsg.content) activeStreamMsg.content = '(空回复)';
    renderMessages();
    isLoading = false;
    document.getElementById('sendBtn').style.display = '';
    document.getElementById('stopBtn').style.display = 'none';
    activeStreamSession = null;
    const resolveFn = activeStreamResolve;
    activeStreamMsg = null;
    activeStreamPromise = null;
    activeStreamResolve = null;
    activeStreamReject = null;
    if (resolveFn) resolveFn();
    return;
  }
  // 错误消息
  if (msg.type === 'error') {
    console.error('AgentLoop error:', msg.error);
    if (activeStreamMsg) {
      activeStreamMsg.streaming = false;
      activeStreamMsg.content = `**错误**: ${msg.error || '未知错误'}`;
      renderMessages();
      isLoading = false;
      document.getElementById('sendBtn').style.display = '';
      document.getElementById('stopBtn').style.display = 'none';
      hideTyping();
    }
    activeStreamSession = null;
    const resolveFn = activeStreamResolve;
    activeStreamMsg = null;
    activeStreamPromise = null;
    activeStreamResolve = null;
    activeStreamReject = null;
    if (resolveFn) resolveFn();
    return;
  }
  // AgentLoop _run_react_stream 推送的事件: {event: "thinking"|"tool_call"|"token"|..., data: {...}}
  // 与 HTTP /stream 的 SSE 事件格式完全一致,复用 handleStreamEvent。
  if (msg.event && activeStreamSession && activeStreamMsg) {
    handleStreamEvent(msg, activeStreamSession, activeStreamMsg);
    return;
  }
  console.log('Chat WS message (unhandled):', msg);
}

// 通过 AgentLoop 发送中断 — 取消当前 ReAct run()
function sendInterrupt() {
  if (chatWs && chatWs.readyState === WebSocket.OPEN && activeStreamSession) {
    chatWs.send(JSON.stringify({
      type: 'interrupt',
      session_id: activeStreamSession.id,
      reason: '用户手动中断',
    }));
    return true;
  }
  return false;
}

// 通过 AgentLoop 发送反馈 — 纠正当前 ReAct 的工具调用
function sendFeedback(correction, category = 'other') {
  if (chatWs && chatWs.readyState === WebSocket.OPEN && activeStreamSession) {
    chatWs.send(JSON.stringify({
      type: 'feedback',
      session_id: activeStreamSession.id,
      correction: correction,
      category: category,
    }));
    return true;
  }
  return false;
}

function handleStreamEvent(event, s, assistantMsg) {
  const type = event.event, d = event.data || {};
  if (type === 'thinking') {
    if (d.reasoning) {
      const thinkMsg = {
        role: 'assistant', is_thinking: true,
        content: d.reasoning,
        iteration: d.iteration || 0,
      };
      const idx = s.messages.indexOf(assistantMsg);
      if (idx > 0) s.messages.splice(idx, 0, thinkMsg);
      else s.messages.push(thinkMsg);
      renderMessages();
    }
    return;
  }
  if (type === 'tool_call') {
    const status = d.rejected ? '🚫' : (d.approved ? '✅' : '⏳');
    let suffix = '';
    if (d.rejected) suffix = ` — ${d.reason || '已拒绝'}`;
    else if (d.approved) suffix = d.feedback ? ` — 已确认${d.feedback ? '：' + d.feedback : ''}` : ' — 已确认';
    const label = toolLabel(d.tool);
    const toolMsg = {
      role: 'assistant', is_tool: true, tool_name: d.tool,
      content: `${status} **${label}**${suffix}`,
    };
    const idx = s.messages.indexOf(assistantMsg);
    if (idx > 0) s.messages.splice(idx, 0, toolMsg);
    else s.messages.push(toolMsg);
    renderMessages();
    return;
  }
  if (type === 'compaction') {
    const reduced = d.reduced || 0;
    const pre = d.pre_tokens || 0;
    const post = d.post_tokens || 0;
    const tipMsg = {
      role: 'assistant', is_tool: true, tool_name: 'compaction',
      content: `🗜️ **上下文压缩** — 历史 token ${pre} → ${post}（减少 ${reduced}），已保留关键决策与未决问题`,
    };
    const idx = s.messages.indexOf(assistantMsg);
    if (idx > 0) s.messages.splice(idx, 0, tipMsg);
    else s.messages.push(tipMsg);
    renderMessages();
    return;
  }
  if (type === 'approval_request') {
    const apMsg = {
      role: 'assistant', is_approval: true,
      approval_id: d.approval_id,
      tool: d.tool,
      summary: d.summary || '',
      iteration: d.iteration || 0,
      resolved: null,
    };
    const idx = s.messages.indexOf(assistantMsg);
    if (idx > 0) s.messages.splice(idx, 0, apMsg);
    else s.messages.push(apMsg);
    renderMessages();
    return;
  }
  if (type === 'tool_result') {
    // design_workflow 返回 nodes 列表 → 解析后初始化 DAG 画板
    if (d.tool === 'design_workflow' && d.result?.output?.nodes) {
      initWorkflowDag(d.result.output.nodes);
    }
    for (let i = s.messages.length - 1; i >= 0; i--) {
      const m = s.messages[i];
      if (m.is_tool && m.tool_name === d.tool && !m.result_shown) {
        m.result_shown = true;
        const summary = toolResultSummary(d.tool, d.result, d.error);
        m.content = m.content.replace('⏳', d.error ? '❌' : '✅');
        m.content += ` — ${summary}`;
        if (!assistantMsg.tools_used.includes(d.tool)) assistantMsg.tools_used.push(d.tool);
        renderMessages();
        break;
      }
    }
    return;
  }
  if (type === 'workflow_progress') {
    // 同时初始化 DAG 画板（若 nodes 字段存在）
    if (d.status === 'started') {
      execActiveWorkflowId = d.workflow_id;
      initExecPanel(d.label || '', d.nodes || []);
      if (d.nodes && d.nodes.length) initWorkflowDag(d.nodes);
    } else if (d.status === 'completed' || d.status === 'failed') {
      updateExecNode(d.node_id, d.status === 'failed' ? 'failed' : 'done', d.summary || '');
      if (d.node_id) {
        dagNodeStates[d.node_id] = (d.status === 'failed') ? 'failed' : 'done';
        renderDagGraph();
      }
    }
    return;
  }
  if (type === 'token') {
    assistantMsg.content += d.content || '';
    updateStreamingBubble(assistantMsg);
    return;
  }
  if (type === 'final') {
    if (d.reply) assistantMsg.content = d.reply;
    assistantMsg.tools_used = d.tools_used || assistantMsg.tools_used;
    assistantMsg.workflow_ids = d.workflow_ids || [];
    assistantMsg.tier = d.tier;
    assistantMsg.streaming = false;
    updateMeta(s, { tier: d.tier, tools_used: d.tools_used });
    renderMessages();
    return;
  }
  if (type === 'error') {
    assistantMsg.content = `**错误**: ${d.message || '未知错误'}`;
    assistantMsg.streaming = false;
    renderMessages();
    return;
  }
}

// ══════════════════════════════════════════════
// Execution Panel — 执行监控面板
// ══════════════════════════════════════════════

function openExecPanel() {
  execPanelOpen = true;
  const panel = document.getElementById('execPanel');
  panel.classList.add('open');
  document.getElementById('execToggleBtn').style.display = 'none';
}

function closeExecPanel() {
  execPanelOpen = false;
  const panel = document.getElementById('execPanel');
  panel.classList.remove('open');
  if (execActiveWorkflowId && !execRunCompleted) {
    document.getElementById('execToggleBtn').style.display = 'flex';
  }
}

function resetExecPanel() {
  execNodes = [];
  execPanelOpen = false;
  execRunCompleted = false;
  execActiveWorkflowId = null;
  dagNodes = []; dagEdges = []; dagNodeStates = {}; dagPositions = {};
  const panel = document.getElementById('execPanel');
  panel.classList.remove('open');
  document.getElementById('execToggleBtn').style.display = 'none';
  document.getElementById('execToggleLabel').textContent = '';
  document.getElementById('execWorkflowTitle').textContent = '';
  document.getElementById('execWorkflowTitle').style.display = 'none';
  document.getElementById('execProgressFill').style.width = '0%';
  document.getElementById('execProgressText').textContent = '';
  document.getElementById('execPanelStats').textContent = '';
  document.getElementById('execNodeList').innerHTML = '';
  document.getElementById('execSummary').style.display = 'none';
}

async function stopExecution() {
  if (activeAbortController) {
    activeAbortController.abort();
    activeAbortController = null;
  }
  if (execActiveWorkflowId) {
    try {
      await fetch(`${API_BASE}/chat/cancel`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ workflow_id: execActiveWorkflowId }),
      });
    } catch (e) {
      console.warn('Cancel workflow request failed:', e);
    }
  }
  execNodes.forEach(n => {
    if (n.status === 'running' || n.status === 'pending') {
      n.status = 'cancelled';
      if (dagNodeStates[n.node_id]) dagNodeStates[n.node_id] = 'cancelled';
    }
  });
  execRunCompleted = true;
  renderExecNodes();
  updateExecProgress();
  renderDagGraph();
  showStopSummary();
  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  hideTyping();
}

function showStopSummary() {
  const summaryEl = document.getElementById('execSummary');
  const stopped = execNodes.filter(n => n.status === 'cancelled').length;
  const done = execNodes.filter(n => n.status === 'done' || n.status === 'failed').length;
  const html = `<div class="exec-summary-title">已停止</div><div class="exec-summary-text">
    <span style="color:var(--amber)">执行已被用户中断</span><br>
    已完成 ${done} 个节点，已取消 ${stopped} 个节点
  </div>`;
  summaryEl.innerHTML = html;
  summaryEl.style.display = 'block';
}

// ══════════════════════════════════════════════
// 模式切换
// ══════════════════════════════════════════════
function switchMode(mode) {
  if (currentMode === mode) return;
  currentMode = mode;
  document.querySelectorAll('.mode-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.mode === mode);
  });
  const input = document.getElementById('chatInput');
  const hint = document.querySelector('.input-hint');
  const attachBtn = document.querySelector('.btn-attach');
  switch (mode) {
    case 'chat':
      input.placeholder = '输入消息，Enter 发送，Shift+Enter 换行';
      hint.textContent = '支持图片 / PDF / Word / Excel / CSV / ZIP 上传';
      attachBtn.style.display = '';
      input.style.display = '';
      break;
    case 'batch':
      input.placeholder = '描述数据集处理需求，或直接上传 ZIP 文件';
      hint.textContent = '上传 ZIP 数据集（含多张图片），系统将并行处理';
      attachBtn.style.display = '';
      input.style.display = '';
      break;
    case 'live':
      input.placeholder = '流水线监听中... 可通过 webhook 推送图片';
      hint.textContent = 'Webhook: POST /api/v1/live/{session_id}';
      attachBtn.style.display = 'none';
      input.style.display = '';
      break;
  }
}

function initExecPanel(title, nodeList) {
  execNodes = nodeList.map(n => ({
    node_id: n.node_id,
    label: n.label || n.node_id,
    status: 'pending',
    summary: ''
  }));
  execRunCompleted = false;
  const titleEl = document.getElementById('execWorkflowTitle');
  if (title) {
    titleEl.textContent = title;
    titleEl.style.display = 'block';
  } else {
    titleEl.style.display = 'none';
  }
  if (execNodes.length > 0) {
    execNodes[0].status = 'running';
    dagNodeStates[execNodes[0].node_id] = 'running';
  }
  document.getElementById('execSummary').style.display = 'none';
  renderExecNodes();
  updateExecProgress();
  openExecPanel();
}

function updateExecNode(nodeId, status, summary) {
  const node = execNodes.find(n => n.node_id === nodeId);
  if (!node) return;
  node.status = status;
  if (summary) node.summary = summary;
  if (status === 'done' || status === 'failed') {
    const nextPending = execNodes.find(n => n.status === 'pending');
    if (nextPending) {
      nextPending.status = 'running';
      dagNodeStates[nextPending.node_id] = 'running';
    }
  }
  renderExecNodes();
  updateExecProgress();
  renderDagGraph();
}

function renderExecNodes() {
  const list = document.getElementById('execNodeList');
  const icons = {
    pending: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>',
    running: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z"/></svg>',
    done: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>',
    failed: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
    cancelled: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
  };
  list.innerHTML = execNodes.map((n, idx) => {
    const cls = n.status;
    const icon = icons[cls] || icons.pending;
    const label = escHtml(n.label);
    const summary = n.summary ? `<div class="exec-node-summary">${escHtml(n.summary)}</div>` : '';
    const hasDetail = n.data && Object.keys(n.data).length > 0;
    const clickable = hasDetail ? ` style="cursor:pointer" onclick="toggleNodeDetail(${idx})"` : '';
    const detailIcon = hasDetail ? ' <span style="font-size:10px;opacity:.6">▾</span>' : '';
    const detailHtml = hasDetail ? `<div class="exec-node-detail" id="nodeDetail${idx}" style="display:none">${escHtml(JSON.stringify(n.data, null, 2))}</div>` : '';
    return `<div class="exec-node ${cls}"${clickable}>
      <div class="exec-node-icon ${cls}">${icon}</div>
      <div class="exec-node-info">
        <div class="exec-node-label">${label}${detailIcon}</div>
        ${summary}
        ${detailHtml}
      </div>
    </div>`;
  }).join('');
}

function toggleNodeDetail(idx) {
  const el = document.getElementById(`nodeDetail${idx}`);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function updateExecProgress() {
  const total = execNodes.length;
  const done = execNodes.filter(n => n.status === 'done' || n.status === 'failed').length;
  const running = execNodes.filter(n => n.status === 'running').length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('execProgressFill').style.width = pct + '%';
  document.getElementById('execProgressText').textContent =
    `${done}/${total} 完成` + (running > 0 ? ' · 1 执行中' : '');
  document.getElementById('execPanelStats').textContent = `${done}/${total}`;
  // 同步 DAG 画板顶部 stats
  const dagStats = document.getElementById('wfCanvasStats');
  if (dagStats) dagStats.textContent = `${done}/${total} · ${pct}%`;
  const btn = document.getElementById('execToggleBtn');
  if (execActiveWorkflowId && total > 0) {
    document.getElementById('execToggleLabel').textContent = `执行中 ${done}/${total}`;
    if (!execPanelOpen && !execRunCompleted) {
      btn.style.display = 'flex';
    }
  }
  const allDone = total > 0 && done >= total;
  if (allDone && !execRunCompleted) {
    execRunCompleted = true;
    showExecSummary();
    btn.style.display = 'none';
  }
}

function renderMarkdown(text) {
  if (!text) return '';
  let h = escHtml(text);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>'); h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>'); h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/^---$/gm, '<hr>');
  h = h.replace(/^- (.+)$/gm, '<li>$1</li>'); h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  h = h.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  h = h.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  h = renderTables(h);
  h = h.replace(/\n\n/g, '</p><p>'); h = '<p>' + h + '</p>';
  h = h.replace(/<p>\s*<(h[1-3]|pre|ul|ol|hr|blockquote|table)/g, '<$1');
  h = h.replace(/<\/(h[1-3]|pre|ul|ol|hr|blockquote|table)>\s*<\/p>/g, '</$1>');
  h = h.replace(/<p>\s*<\/p>/g, '');
  return h;
}

function renderTables(html) {
  const lines = html.split('\n'); let out = [], rows = [], inT = false;
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('|') && t.endsWith('|')) { if (t.replace(/[\|\s\-]/g, '') === '') continue; inT = true; rows.push(t.split('|').filter(c => c.trim()).map(c => c.trim())); }
    else { if (inT) { out.push(buildTable(rows)); rows = []; inT = false; } out.push(line); }
  }
  if (inT) out.push(buildTable(rows));
  return out.join('\n');
}
function buildTable(rows) {
  if (!rows.length) return '';
  return `<table><thead><tr>${rows[0].map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
