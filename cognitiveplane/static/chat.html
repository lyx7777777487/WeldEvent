<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volcano Cognitive Plane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;450;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-root: #0a0a0f;
  --bg-sidebar: #0f0f17;
  --bg-main: #0c0c12;
  --bg-hover: #181824;
  --bg-active: #1f1f2e;
  --bg-bubble: #161620;
  --bg-input: #12121a;
  --bg-card: #13131d;
  --bg-glass: rgba(20, 20, 30, 0.7);

  --border: #252535;
  --border-subtle: #1a1a26;
  --border-glow: rgba(139, 92, 246, 0.3);

  --text-primary: #f0f0f8;
  --text-secondary: #9898b0;
  --text-muted: #5e5e78;

  --accent: #8b5cf6;
  --accent-2: #06b6d4;
  --accent-soft: rgba(139, 92, 246, 0.08);
  --accent-hover: rgba(139, 92, 246, 0.16);
  --accent-glow: rgba(139, 92, 246, 0.4);

  --green: #10b981;
  --green-soft: rgba(16, 185, 129, 0.10);
  --green-glow: rgba(16, 185, 129, 0.3);
  --amber: #f59e0b;
  --amber-soft: rgba(245, 158, 11, 0.10);
  --amber-glow: rgba(245, 158, 11, 0.3);
  --red: #ef4444;
  --red-soft: rgba(239, 68, 68, 0.10);
  --red-glow: rgba(239, 68, 68, 0.3);

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --radius-xs: 8px;

  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 20px rgba(139, 92, 246, 0.15);

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  background: var(--bg-root);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  font-size: 15px;
}

body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: 
    radial-gradient(ellipse at 20% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.02) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
  animation: bgShift 20s ease-in-out infinite;
}

@keyframes bgShift {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(-2%, 1%) rotate(1deg); }
  66% { transform: translate(1%, -1%) rotate(-0.5deg); }
}

.app { 
  display: flex; 
  height: 100vh; 
  position: relative;
  z-index: 1;
}

.sidebar {
  width: 280px; min-width: 280px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-subtle);
  display: flex; flex-direction: column;
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  z-index: 10;
  position: relative;
}

.sidebar::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  width: 1px;
  height: 100%;
  background: linear-gradient(to bottom, transparent, var(--border-glow), transparent);
  opacity: 0.5;
}

/* 窄屏遮罩 — 点击收起 sidebar */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 9;
  opacity: 0;
  transition: opacity .3s ease;
}
.sidebar-overlay.show { display: block; opacity: 1; }
@media (min-width: 769px) { .sidebar-overlay { display: none !important; } }

.sidebar-header { padding: 22px 18px 18px; }
.brand {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px; padding: 0 4px;
}
.brand-mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #06b6d4 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
  position: relative;
  overflow: hidden;
}
.brand-mark::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer {
  0% { left: -100%; }
  50%, 100% { left: 100%; }
}
.brand-name { 
  font-size: 16px; font-weight: 600; letter-spacing: -.3px;
  background: linear-gradient(135deg, #f0f0f8 0%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand-ver { 
  font-size: 10px; font-weight: 600; color: var(--text-muted); 
  margin-left: 6px; letter-spacing: .5px;
  background: var(--bg-hover);
  padding: 2px 6px;
  border-radius: 4px;
  -webkit-text-fill-color: var(--text-muted);
}

.btn-new-chat {
  width: 100%; padding: 11px 16px;
  background: linear-gradient(135deg, var(--accent-soft) 0%, transparent 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-secondary);
  font-size: 13.5px; font-weight: 500; font-family: var(--font-sans);
  cursor: pointer; display: flex; align-items: center; gap: 10px;
  transition: all .2s cubic-bezier(.4,0,.2,1); 
  letter-spacing: -.1px;
  position: relative;
  overflow: hidden;
}
.btn-new-chat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(135deg, var(--accent-hover), transparent);
  opacity: 0;
  transition: opacity .2s ease;
}
.btn-new-chat:hover { 
  background: var(--bg-hover); 
  color: var(--text-primary); 
  border-color: var(--border-glow);
  transform: translateY(-1px);
  box-shadow: var(--shadow-glow);
}
.btn-new-chat:hover::before { opacity: 1; }
.btn-new-chat svg { width: 16px; height: 16px; opacity: .8; position: relative; z-index: 1; }
.btn-new-chat span { position: relative; z-index: 1; }

.sidebar-list { flex: 1; overflow-y: auto; padding: 6px 10px 10px; }
.session-date-label {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  padding: 16px 10px 8px; letter-spacing: .6px;
  text-transform: uppercase;
}
.session-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all .15s cubic-bezier(.4,0,.2,1);
  font-size: 13.5px; color: var(--text-secondary);
  position: relative;
  margin-bottom: 2px;
}
.session-row:hover { 
  background: var(--bg-hover); 
  color: var(--text-primary);
  transform: translateX(2px);
}
.session-row.active { 
  background: linear-gradient(135deg, var(--accent-soft), transparent);
  color: var(--text-primary);
  border: 1px solid rgba(139, 92, 246, 0.15);
}
.session-row.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 20px;
  background: linear-gradient(to bottom, var(--accent), var(--accent-2));
  border-radius: 0 2px 2px 0;
}
.session-row .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-muted); flex-shrink: 0; 
  transition: all .2s ease;
  box-shadow: 0 0 0 2px transparent;
}
.session-row.active .dot { 
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 0 8px var(--accent-glow);
}
.session-row .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.session-row .btn-del {
  opacity: 0; width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none; color: var(--text-muted);
  cursor: pointer; border-radius: 6px; flex-shrink: 0; 
  transition: all .15s ease;
}
.session-row:hover .btn-del { opacity: 1; }
.session-row .btn-del:hover { 
  color: var(--red); 
  background: var(--red-soft);
  transform: scale(1.1);
}

.sidebar-footer { padding: 16px 18px; border-top: 1px solid var(--border-subtle); }
.status-line { 
  display: flex; align-items: center; gap: 10px; 
  font-size: 12px; color: var(--text-muted);
  padding: 8px 10px;
  background: var(--bg-hover);
  border-radius: var(--radius-sm);
}
.status-pulse { 
  width: 8px; height: 8px; border-radius: 50%; 
  flex-shrink: 0; background: var(--green);
  position: relative;
}
.status-pulse::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 100%; height: 100%;
  border-radius: 50%;
  background: inherit;
  animation: pulseRing 2s ease-out infinite;
}
@keyframes pulseRing {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
  100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
}
.status-pulse.off { background: var(--red); }
.status-pulse.off::after { animation: none; }

.main-panel { 
  flex: 1; display: flex; flex-direction: column; 
  min-width: 0; background: var(--bg-main);
  position: relative;
}

.main-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
  opacity: 0.3;
}

.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; border-bottom: 1px solid var(--border-subtle); 
  min-height: 56px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: var(--bg-glass);
}
.top-left { display: flex; align-items: center; gap: 14px; }
.btn-menu {
  display: none; width: 36px; height: 36px;
  border: none; background: none; color: var(--text-secondary);
  cursor: pointer; border-radius: var(--radius-xs);
  align-items: center; justify-content: center;
  transition: all .15s ease;
}
.btn-menu:hover { background: var(--bg-hover); color: var(--text-primary); }
.top-title { 
  font-size: 15px; font-weight: 600; 
  letter-spacing: -.2px;
}
.top-meta { display: flex; align-items: center; gap: 12px; }
.pill {
  font-size: 11px; font-weight: 600; padding: 5px 12px;
  border-radius: 99px; font-family: var(--font-mono); 
  letter-spacing: .3px;
  text-transform: uppercase;
  border: 1px solid transparent;
  transition: all .2s ease;
}
.pill-fc { 
  background: var(--accent-soft); color: var(--accent); 
  border-color: rgba(139, 92, 246, 0.2);
}
.pill-so { 
  background: var(--amber-soft); color: var(--amber);
  border-color: rgba(245, 158, 11, 0.2);
}
.pill-kw { 
  background: var(--green-soft); color: var(--green);
  border-color: rgba(16, 185, 129, 0.2);
}

.msg-scroll { 
  flex: 1; overflow-y: auto; 
  scroll-behavior: smooth;
  position: relative;
}
.msg-container { max-width: 820px; margin: 0 auto; padding: 36px 28px 28px; }

.hero {
  display: flex; flex-direction: column; align-items: center;
  padding: 72px 24px 48px; text-align: center;
  animation: fadeUp .6s cubic-bezier(.4,0,.2,1);
}
@keyframes fadeUp { 
  from { opacity: 0; transform: translateY(24px); } 
  to { opacity: 1; transform: translateY(0); } 
}
.hero-logo {
  width: 64px; height: 64px; border-radius: 18px;
  background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #06b6d4 100%);
  display: flex; align-items: center; justify-content: center; 
  margin-bottom: 28px;
  box-shadow: 0 8px 32px rgba(139, 92, 246, 0.3),
              0 0 60px rgba(139, 92, 246, 0.15);
  position: relative;
}
.hero-logo::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 20px;
  background: linear-gradient(135deg, #8b5cf6, #06b6d4, #8b5cf6);
  z-index: -1;
  animation: logoSpin 8s linear infinite;
  opacity: 0.6;
  filter: blur(8px);
}
@keyframes logoSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.hero-logo svg { width: 30px; height: 30px; color: #fff; }
.hero h1 { 
  font-size: 28px; font-weight: 700; letter-spacing: -.6px; 
  margin-bottom: 10px;
  background: linear-gradient(135deg, #f0f0f8 0%, #c4b5fd 50%, #a78bfa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero p { 
  color: var(--text-secondary); font-size: 15px; line-height: 1.7; 
  max-width: 500px; margin-bottom: 44px; 
  font-weight: 400;
}

.quick-grid { 
  display: grid; grid-template-columns: repeat(2, 1fr); 
  gap: 12px; width: 100%; max-width: 580px; 
}
.quick-card {
  padding: 18px 20px; border: 1px solid var(--border);
  border-radius: var(--radius-md); text-align: left; cursor: pointer;
  transition: all .25s cubic-bezier(.4,0,.2,1); 
  background: linear-gradient(145deg, var(--bg-card), var(--bg-input));
  font-family: var(--font-sans); color: var(--text-primary);
  position: relative;
  overflow: hidden;
}
.quick-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
}
.quick-card::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width .4s ease, height .4s ease;
}
.quick-card:hover { 
  border-color: var(--border-glow); 
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
}
.quick-card:hover::after {
  width: 300px; height: 300px;
}
.quick-card .label { 
  font-size: 14px; font-weight: 600; margin-bottom: 5px; 
  letter-spacing: -.1px;
  position: relative; z-index: 1;
}
.quick-card .hint { 
  font-size: 12.5px; color: var(--text-muted);
  position: relative; z-index: 1;
}

.chat-msg {
  margin-bottom: 32px; animation: msgIn .3s cubic-bezier(.4,0,.2,1);
}
@keyframes msgIn { 
  from { opacity: 0; transform: translateY(12px); } 
  to { opacity: 1; transform: translateY(0); } 
}
.chat-msg .role-tag {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  margin-bottom: 10px; text-transform: uppercase; letter-spacing: .8px;
  display: flex; align-items: center; gap: 8px;
}
.chat-msg .role-tag::before {
  content: '';
  width: 16px; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  border-radius: 1px;
}
.chat-msg .body { 
  font-size: 15px; line-height: 1.78; color: var(--text-primary); 
  font-weight: 400;
}
.chat-msg .body p { margin-bottom: 14px; }
.chat-msg .body p:last-child { margin-bottom: 0; }
.chat-msg .body h1, .chat-msg .body h2, .chat-msg .body h3 { 
  font-weight: 600; letter-spacing: -.3px; margin: 24px 0 12px; 
  color: var(--text-primary);
}
.chat-msg .body h1 { font-size: 22px; }
.chat-msg .body h2 { font-size: 18px; }
.chat-msg .body h3 { font-size: 16px; }
.chat-msg .body ul, .chat-msg .body ol { margin: 12px 0; padding-left: 24px; }
.chat-msg .body li { margin-bottom: 6px; }
.chat-msg .body strong { font-weight: 600; color: #fff; }
.chat-msg .body code {
  font-family: var(--font-mono); font-size: .86em;
  background: var(--bg-bubble); padding: 3px 8px;
  border-radius: 6px; border: 1px solid var(--border); 
  color: #c4b5fd; font-weight: 500;
}
.chat-msg .body pre {
  background: linear-gradient(145deg, var(--bg-sidebar), var(--bg-card)); 
  border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: 18px 22px; 
  overflow-x: auto; margin: 16px 0;
  position: relative;
}
.chat-msg .body pre::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
  opacity: 0.5;
}
.chat-msg .body pre code { 
  background: none; border: none; padding: 0; 
  font-size: .85em; line-height: 1.7; color: var(--text-primary); 
  font-weight: 400;
}
.chat-msg .body table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 16px 0; font-size: .92em; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); }
.chat-msg .body th, .chat-msg .body td { padding: 11px 16px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
.chat-msg .body th { 
  background: var(--bg-sidebar); font-weight: 600; color: var(--accent); 
  font-size: .82em; text-transform: uppercase; letter-spacing: .4px;
}
.chat-msg .body tr:last-child td { border-bottom: none; }
.chat-msg .body tr:hover td { background: var(--bg-hover); }
.chat-msg .body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.chat-msg .body blockquote { 
  border-left: 3px solid var(--accent); 
  padding: 4px 0 4px 18px; color: var(--text-secondary); 
  margin: 16px 0;
  background: var(--accent-soft);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.thumb-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.thumb-strip img { 
  width: 88px; height: 88px; border-radius: var(--radius-sm); 
  object-fit: cover; border: 1px solid var(--border);
  transition: all .2s ease;
  cursor: pointer;
}
.thumb-strip img:hover {
  border-color: var(--border-glow);
  transform: scale(1.05);
  box-shadow: var(--shadow-md);
}

.tool-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.tool-chip {
  font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 99px;
  font-family: var(--font-mono); background: var(--accent-soft);
  color: #c4b5fd; border: 1px solid rgba(139,92,246,.2);
  transition: all .15s ease;
}
.tool-chip:hover {
  background: var(--accent-hover);
  border-color: var(--border-glow);
}

/* 确认/取消工作流按钮 */
.confirm-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-confirm, .btn-cancel {
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  padding: 8px 18px; border-radius: var(--radius-xs); cursor: pointer;
  border: 1px solid transparent; transition: all .15s ease;
}
.btn-confirm {
  background: var(--green); color: #fff;
  box-shadow: 0 0 12px var(--green-glow);
}
.btn-confirm:hover { background: #0ea271; transform: translateY(-1px); }
.btn-cancel {
  background: transparent; color: var(--text-secondary);
  border-color: var(--border);
}
.btn-cancel:hover { background: var(--bg-hover); color: var(--text-primary); }

.typing-row { display: flex; gap: 6px; padding: 8px 0; }
.typing-row span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  animation: dotBounce 1.4s ease-in-out infinite;
  box-shadow: 0 0 8px var(--accent-glow);
}
.typing-row span:nth-child(2) { animation-delay: .15s; }
.typing-row span:nth-child(3) { animation-delay: .3s; }
@keyframes dotBounce {
  0%, 60%, 100% { opacity: .3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-8px); }
}

.wf-panel {
  border-top: 1px solid var(--border);
  background: var(--bg-sidebar);
  max-height: 0;
  overflow: hidden;
  transition: max-height .4s cubic-bezier(.4,0,.2,1), padding .4s ease;
  position: relative;
}
.wf-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border-glow), var(--accent-2), transparent);
}
.wf-panel.open { max-height: 460px; }

.wf-panel-inner { padding: 0 28px; }
.wf-panel.open .wf-panel-inner { padding: 20px 28px; }

.wf-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
}
.wf-title { font-size: 14px; font-weight: 600; color: var(--text-secondary); letter-spacing: -.1px; }
.wf-stats { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); font-weight: 500; }

.wf-progress-bar {
  height: 4px; background: var(--bg-hover); border-radius: 3px; margin-bottom: 16px; overflow: hidden;
}
.wf-progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 3px; transition: width .5s cubic-bezier(.4,0,.2,1);
  position: relative;
  box-shadow: 0 0 10px var(--accent-glow);
}
.wf-progress-fill::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;

<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">W</div>
        <span class="brand-name">Volcano<span class="brand-ver">v0.2</span></span>
      </div>
      <button class="btn-new-chat" onclick="newSession()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

        </button>

    <div class="msg-scroll" id="msgScroll">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5m-9.25-11.396c.251.023.501.05.75.082M19 14.5l-3.091-3.091a2.25 2.25 0 01-.659-1.591V3.186m0 0a24.3 24.3 0 00-4.5 0"/></svg>
          </div>

            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

<script>
// 同源相对路径 — 避免浏览器代理拦截 127.0.0.1 的绝对 URL 请求
const API_BASE = '/api/v1';

let sessions = JSON.parse(localStorage.getItem('we_sessions') || '[]');
let currentSessionId = null;
let isLoading = false;
let pendingImages = [];
let pendingFileList = [];

let wfCards = [];
let wfExpandedCard = null;

document.addEventListener('DOMContentLoaded', () => {
  checkHealth();
  renderSessions();
  if (sessions.length > 0) switchSession(sessions[0].id);
  document.getElementById('chatInput').focus();
});

async function checkHealth() {
  try {
    const r = await fetch(`${API_BASE}/health`);
    const d = await r.json();
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    if (d.status === 'ok') { dot.className = 'status-pulse'; txt.textContent = '已连接 · v' + d.version; }
    else { dot.className = 'status-pulse off'; txt.textContent = '异常'; }
  } catch {
    document.getElementById('statusDot').className = 'status-pulse off';
    document.getElementById('statusText').textContent = '未连接';
  }
}

function saveSessions() { localStorage.setItem('we_sessions', JSON.stringify(sessions)); }

function newSession() {
  const s = { id: 'sess_' + Date.now(), title: '新对话', messages: [], createdAt: Date.now() };
  sessions.unshift(s); saveSessions();
  switchSession(s.id); renderSessions();
  document.getElementById('chatInput').focus();
}

function switchSession(id) {
  currentSessionId = id; renderSessions(); renderMessages();
  const s = sessions.find(x => x.id === id);
  document.getElementById('chatTitle').textContent = s ? s.title : '新对话';
  updateMeta(s);
  // 窄屏选中会话后自动收起 sidebar
  closeSidebar();
}

function deleteSession(id, e) {
  e.stopPropagation();
  sessions = sessions.filter(x => x.id !== id); saveSessions();
  if (currentSessionId === id) { currentSessionId = sessions.length > 0 ? sessions[0].id : null; renderMessages(); }
  renderSessions();
}

function renderSessions() {
  const el = document.getElementById('sessionList');
  if (!sessions.length) {
    el.innerHTML = '<div style="padding:32px 16px;text-align:center;color:var(--text-muted);font-size:13px;line-height:1.8">暂无对话<br><span style="font-size:12px;opacity:.7">点击上方按钮开始</span></div>';
    return;
  }
  const today = [], older = [];
  const now = Date.now();
  sessions.forEach(s => (now - s.createdAt < 864e5 ? today : older).push(s));
  let h = '';
  if (today.length) { h += '<div class="session-date-label">今天</div>'; today.forEach(s => h += sessionRow(s)); }
  if (older.length) { h += '<div class="session-date-label">更早</div>'; older.forEach(s => h += sessionRow(s)); }
  el.innerHTML = h;
}

function sessionRow(s) {
  const cls = s.id === currentSessionId ? ' active' : '';
  return `<div class="session-row${cls}" onclick="switchSession('${s.id}')">
    <div class="dot"></div><span class="title">${escHtml(s.title)}</span>
    <button class="btn-del" onclick="deleteSession('${s.id}', event)" title="删除">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>`;
}

function renderMessages() {
  const container = document.getElementById('msgContainer');
  const s = sessions.find(x => x.id === currentSessionId);
  if (!s || !s.messages.length) { container.innerHTML = ''; container.appendChild(makeHero()); return; }
  container.innerHTML = s.messages.map(m => msgHTML(m)).join('');
  scrollDown();
}

function makeHero() {
  const el = document.createElement('div');
  el.className = 'hero'; el.id = 'hero';
  el.innerHTML = `<div class="hero-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714a2.25 2.25 0 00.659 1.591L19 14.5m-9.25-11.396c.251.023.501.05.75.082M19 14.5l-3.091-3.091a2.25 2.25 0 01-.659-1.591V3.186m0 0a24.3 24.3 0 00-4.5 0"/></svg></div><h1>Volcano Cognitive Plane</h1><p>工业质检智能决策引擎 — 标准查询 · 案例检索 · 工艺参数 · 工作流设计 · 焊缝图像分析</p><div class="quick-grid"><button class="quick-card" onclick="sendQuick('查询NB/T47014标准中关于预热温度的规定')"><div class="label">查询焊接标准</div><div class="hint">NB/T47014 预热温度规定</div></button><button class="quick-card" onclick="sendQuick('查询GMAW焊接的工艺参数')"><div class="label">查询工艺参数</div><div class="hint">GMAW 焊接参数参考</div></button><button class="quick-card" onclick="sendQuick('查找类似的夹渣缺陷处理案例')"><div class="label">检索历史案例</div><div class="hint">夹渣缺陷处理经验</div></button><button class="quick-card" onclick="sendQuick('请设计一个完整的焊缝质检工作流')"><div class="label">设计工作流</div><div class="hint">焊缝质检全流程</div></button></div>`;
  return el;
}

function msgHTML(m) {
  const isUser = m.role === 'user';
  const role = isUser ? '你' : 'Volcano';
  let imgs = '';
  if (isUser && m.images && m.images.length) {
    imgs = '<div class="thumb-strip">' + m.images.map(src => `<img src="${escHtml(src)}">`).join('') + '</div>';
  }
  let tools = '';
  if (!isUser && m.tools_used && m.tools_used.length) {
    tools = '<div class="tool-row">' + m.tools_used.map(t => `<span class="tool-chip">${escHtml(t)}</span>`).join('') + '</div>';
  }
  const body = isUser ? escHtml(m.content) : renderMarkdown(m.content);
  // 检测确认请求：tools_used 含 request_confirmation 或正文含确认关键词
  let confirmBtns = '';
  if (!isUser) {
    const hasConfirmTool = (m.tools_used || []).includes('request_confirmation');
    const hasConfirmText = /确认启动|请确认|等待确认|是否启动|确认后|请通过通知/.test(m.content || '');
    if (hasConfirmTool || hasConfirmText) {
      confirmBtns = '<div class="confirm-row"><button class="btn-confirm" onclick="confirmWorkflow()">确认启动工作流</button><button class="btn-cancel" onclick="cancelWorkflow()">取消</button></div>';
    }
  }
  return `<div class="chat-msg"><div class="role-tag">${role}</div>${imgs}<div class="body">${body}</div>${tools}${confirmBtns}</div>`;
}

// 确认/取消工作流：自动发送消息触发 launch_workflow 或终止
function confirmWorkflow() {
  const input = document.getElementById('chatInput');
  input.value = '确认启动工作流。请直接使用 launch_workflow 工具启动之前设计的工作流，无需再次确认。';
  sendMessage();
}
function cancelWorkflow() {
  const input = document.getElementById('chatInput');
  input.value = '取消工作流启动。';
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isLoading) return;
  if (!currentSessionId) newSession();
  const s = sessions.find(x => x.id === currentSessionId);
  if (!s) return;
  console.log('[DEBUG sendMessage] pendingFileList=', pendingFileList.length, 'pendingImages=', pendingImages.length, 'text=', text);

  const fc = pendingFileList.length;
  s.messages.push({ role: 'user', content: text, images: pendingImages.length ? [...pendingImages] : undefined, fileCount: fc || undefined });
  if (s.messages.length === 1) { s.title = text.slice(0, 30) + (text.length > 30 ? '...' : ''); renderSessions(); }

  const isWorkflow = fc >= 3 || /批量|工作流|标注.*图|处理.*图|分析.*图/ig.test(text);
  if (isWorkflow && fc >= 2) {
    startWorkflowSimulation(pendingFileList, pendingImages, s.id);
  }

  input.value = ''; input.style.height = 'auto';
  // 注意：pendingFileList 不能在这里清空！下面的 fetch 还要用它构造 FormData。
  // 清空操作移到请求完成之后（finally 块）。
  document.getElementById('imagePreview').innerHTML = '';
  renderMessages(); showTyping();
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  try {
    if (fc > 0) {
      // 文件上传 — 非流式（multipart/form-data，保持原路径）
      const fd = new FormData(); fd.append('message', text); fd.append('session_id', s.id);
      pendingFileList.forEach(f => fd.append('files', f));
      const r = await fetch(`${API_BASE}/chat/upload`, { method: 'POST', body: fd }); const data = await r.json();
      hideTyping();
      s.messages.push({ role: 'assistant', content: data.error ? `**错误**: ${data.error}` : (data.reply || '(空回复)'), tools_used: data.tools_used || [], tier: data.tier });
      updateMeta(s, data);
    } else {
      // 纯文本 — 流式 SSE（打字机 token + 工具气泡 + 思考过程）
      await sendStreamMessage(text, s);
    }
  } catch (err) {
    hideTyping();
    s.messages.push({ role: 'assistant', content: `**连接失败**: ${err.message}`, tools_used: [] });
  } finally {
    // 请求完成（成功或失败）后才清空待发送文件列表
    pendingImages = []; pendingFileList = [];
  }
  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  saveSessions(); renderMessages(); scrollDown();
  input.focus();
}

// ── 流式 SSE 消费（POST /chat/stream + fetch ReadableStream）──
// EventSource 不支持 POST，所以用 fetch + reader 手动解析 SSE 格式（data: {json}\n\n）。
// 渲染策略：
//   - thinking: 忽略（typing 指示器已隐藏，assistant 空气泡已显示）
//   - tool_call: 在 streaming assistant 气泡前插入工具调用气泡
//   - tool_result: 更新对应工具气泡，显示结果摘要
//   - token: 逐 token 追加到 streaming assistant 气泡（局部刷新 DOM，不全量重渲染）
//   - final: 全量重渲染 + updateMeta
//   - error: 显示错误
async function sendStreamMessage(text, s) {
  const r = await fetch(`${API_BASE}/chat/stream`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, session_id: s.id }),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);

  // 创建 streaming assistant 消息（content 逐 token 增长）
  const assistantMsg = { role: 'assistant', content: '', tools_used: [], streaming: true };
  s.messages.push(assistantMsg);
  hideTyping();
  renderMessages(); // 显示空气泡

  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    // SSE 事件以 \n\n 分隔
    const parts = buffer.split('\n\n');
    buffer = parts.pop(); // 最后一段可能不完整，保留到下次
    for (const part of parts) {
      const line = part.split('\n').find(l => l.startsWith('data: '));
      if (!line) continue;
      let event;
      try { event = JSON.parse(line.slice(6)); } catch { continue; }
      handleStreamEvent(event, s, assistantMsg);
    }
  }
  // 流结束兜底（final 事件未到达时）
  if (assistantMsg.streaming) {
    assistantMsg.streaming = false;
    if (!assistantMsg.content) assistantMsg.content = '(空回复)';
    renderMessages();
  }
}

function handleStreamEvent(event, s, assistantMsg) {
  const type = event.event, d = event.data || {};
  if (type === 'thinking') {
    // 思考中 — 可选：在 assistant 气泡显示 "思考中..." 闪烁
    return;
  }
  if (type === 'tool_call') {
    // 插入工具调用气泡（位于 streaming assistant 气泡之前）
    const argStr = d.arguments ? JSON.stringify(d.arguments).slice(0, 100) : '';
    const status = d.rejected ? '❌' : '🔧';
    const reason = d.rejected ? ` (拒绝: ${d.reason || ''})` : '';
    const toolMsg = {
      role: 'assistant', is_tool: true, tool_name: d.tool,
      content: `${status} **${d.tool}**(${argStr})${reason}`,
    };
    const idx = s.messages.indexOf(assistantMsg);
    if (idx > 0) s.messages.splice(idx, 0, toolMsg);
    else s.messages.push(toolMsg);
    renderMessages();
    return;
  }
  if (type === 'tool_result') {
    // 更新最后匹配的工具气泡，显示结果摘要
    for (let i = s.messages.length - 1; i >= 0; i--) {
      const m = s.messages[i];
      if (m.is_tool && m.tool_name === d.tool && !m.result_shown) {
        m.result_shown = true;
        const r = d.result || {};
        const summary = d.error ? `❌ ${d.error}` :
                        (r.output ? `→ \`${JSON.stringify(r.output).slice(0, 120)}\`` : '→ 完成');
        m.content += `\n${summary}`;
        if (!assistantMsg.tools_used.includes(d.tool)) assistantMsg.tools_used.push(d.tool);
        renderMessages();
        break;
      }
    }
    return;
  }
  if (type === 'token') {
    assistantMsg.content += d.content || '';
    // 局部刷新最后一个 assistant 气泡的 body（不全量 renderMessages，避免卡顿）
    updateStreamingBubble(assistantMsg);
    return;
  }
  if (type === 'final') {
    if (d.reply) assistantMsg.content = d.reply;
    assistantMsg.tools_used = d.tools_used || assistantMsg.tools_used;
    assistantMsg.workflow_ids = d.workflow_ids || [];
    assistantMsg.tier = d.tier;
    assistantMsg.streaming = false;
    updateMeta(s, { tier: d.tier, tools_used: d.tools_used });
    renderMessages();
    return;
  }
  if (type === 'error') {
    assistantMsg.content = `**错误**: ${d.message || '未知错误'}`;
    assistantMsg.streaming = false;
    renderMessages();
    return;
  }
}

function updateStreamingBubble(msg) {
  // 找到最后一个 .chat-msg，更新其 .body innerHTML（局部刷新，性能友好）
  const msgs = document.querySelectorAll('#msgContainer .chat-msg');
  if (!msgs.length) { renderMessages(); return; }
  const last = msgs[msgs.length - 1];
  const body = last.querySelector('.body');
  if (body) {
    body.innerHTML = renderMarkdown(msg.content) || '<span style="color:#999">思考中...</span>';
  }
  scrollDown();
}

function updateMeta(session, data) {
  const badge = document.getElementById('tierBadge'), cnt = document.getElementById('toolsCount');
  if (data) {
    const tier = data.tier || session?.messages?.findLast(m => m.tier)?.tier;
    if (tier) { badge.style.display = ''; badge.textContent = tier; const kind = tier.replace('react_','').split('_')[0]; badge.className = 'pill ' + (kind === 'function' ? 'pill-fc' : kind === 'structured' ? 'pill-so' : 'pill-kw'); }
    const n = (session?.messages || []).reduce((a, m) => a + (m.tools_used?.length || 0), 0);
    cnt.textContent = n ? `${n} 工具调用` : '';

}

function renderMarkdown(text) {
  if (!text) return '';
  let h = escHtml(text);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>'); h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>'); h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/^---$/gm, '<hr>');
  h = h.replace(/^- (.+)$/gm, '<li>$1</li>'); h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  h = h.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  h = h.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  h = renderTables(h);
  h = h.replace(/\n\n/g, '</p><p>'); h = '<p>' + h + '</p>';
  h = h.replace(/<p>\s*<(h[1-3]|pre|ul|ol|hr|blockquote|table)/g, '<$1');
  h = h.replace(/<\/(h[1-3]|pre|ul|ol|hr|blockquote|table)>\s*<\/p>/g, '</$1>');
  h = h.replace(/<p>\s*<\/p>/g, '');
  return h;
}

function renderTables(html) {
  const lines = html.split('\n'); let out = [], rows = [], inT = false;
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('|') && t.endsWith('|')) { if (t.replace(/[\|\s\-]/g, '') === '') continue; inT = true; rows.push(t.split('|').filter(c => c.trim()).map(c => c.trim())); }
    else { if (inT) { out.push(buildTable(rows)); rows = []; inT = false; } out.push(line); }
  }
  if (inT) out.push(buildTable(rows));
  return out.join('\n');
}
function buildTable(rows) {
  if (!rows.length) return '';
  return `<table><thead><tr>${rows[0].map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

  { type: '裂纹', sev: 'high', desc: '焊缝中心热裂纹' },
  { type: '咬边', sev: 'low', desc: '轻微咬边，深度 0.3mm' },
  { type: '未熔合', sev: 'high', desc: '侧壁未熔合区域' },
  { type: '气孔', sev: 'med', desc: '密集气孔群，气孔率 3.5%' },
];

function updateWfProgress() {
  const total = wfCards.length;
  const done = wfCards.filter(c => c.status === 'done' || c.status === 'error').length;

}

function updateWfCard(id, update) {

function submitFeedback(cardId) {
  const form = document.getElementById('fb-' + cardId);

function wfCardHTML(c) {
  const expanded = wfExpandedCard === c.id;
  const cls = expanded ? ' expanded' : '';

  let imgContent;
  if (c.imageUrl) {
    imgContent = `<img src="${c.imageUrl}" alt="${escHtml(c.name)}">`;
  } else {
    imgContent = `<div class="placeholder"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>${escHtml(c.name)}</span></div>`;
  }

  let annotLayer = '';
  if (c.annotations && c.annotations.length) {
    annotLayer = '<div class="wf-annot-layer">' + c.annotations.map(a => {
      const [x, y, w, h] = (a.coordinates && a.coordinates.length === 4) ? a.coordinates : [20, 20, 80, 60];
      return `<div class="wf-annot-box" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;"><span class="wf-annot-label">${escHtml(a.label || '缺陷')} ${a.confidence ? Math.round(a.confidence*100)+'%' : ''}</span></div>`;
    }).join('') + '</div>';
  }

  let defectsHtml = '';
  if (c.defects && c.defects.length) {
    defectsHtml = c.defects.map(d => {
      const sevCls = d.sev === 'high' ? 'high' : d.sev === 'med' ? 'med' : 'low';
      return `<span class="wf-card-defect-item"><span class="sev ${sevCls}"></span>${escHtml(d.type)}</span>`;
    }).join('');
  } else if (c.status === 'done') {
    defectsHtml = '<span style="color:var(--green);font-size:11.5px;font-weight:500">✓ 未检测到缺陷</span>';
  }

  const statusCN = { pending: '等待中', running: '分析中', done: '已完成', error: '异常' };

  return `<div class="wf-card${cls}" id="wf-card-${c.id}">
    <div class="wf-card-img" onclick="toggleCardExpand('${c.id}')">
      ${imgContent}
      <div class="wf-card-status ${c.status}">${statusCN[c.status] || c.status}</div>
      ${annotLayer}
    </div>
    <div class="wf-card-info">
      <div class="wf-card-name">${escHtml(c.name)}</div>
      <div class="wf-card-defects">${defectsHtml || '<span style="color:var(--text-muted)">等待分析结果...</span>'}</div>
      ${expanded && c.details ? `<div style="margin-top:10px;font-size:12px;color:var(--text-secondary);line-height:1.7">${escHtml(c.details)}</div>` : ''}
    </div>
    ${(c.status === 'done' || c.status === 'error') ? `
    <div class="wf-card-actions">
      <button class="wf-btn feedback" onclick="toggleCardExpand('${c.id}');setTimeout(()=>document.getElementById('fb-${c.id}')?.focus(),100)">反馈修正</button>
      ${c.imageUrl ? `<button class="wf-btn" onclick="window.open('${c.imageUrl}','_blank')">查看原图</button>` : ''}
    </div>` : ''}
    <div class="wf-feedback-form">
      <textarea id="fb-${c.id}" placeholder="输入修正建议，如：区域标注应为气孔而非夹渣..."></textarea>
      <div class="wf-feedback-actions">
        <span id="fb-status-${c.id}" style="font-size:11px;color:var(--text-muted);margin-right:auto;align-self:center"></span>
        <button class="wf-btn" onclick="toggleCardExpand('${c.id}')">取消</button>
        <button class="wf-btn send" onclick="submitFeedback('${c.id}')">提交反馈</button>
      </div>
    </div>
  </div>`;
}

function startWorkflowSimulation(files, previews, sessionId) {
  wfCards = files.map((f, i) => ({
    id: 'img-' + i,
    name: f.name || `图片 ${i+1}`,
    imageUrl: f.type.startsWith('image/') ? previews[i] || null : null,
    status: 'pending',
    annotations: [],
    defects: [],
    details: ''
  }));
  wfExpandedCard = null;
  openWfPanel();
  renderWfCards();

  let idx = 0;
  function processNext() {
    if (idx >= wfCards.length) return;
    const card = wfCards[idx];
    updateWfCard(card.id, { status: 'running' });

    const delay = 600 + Math.random() * 1200;
    setTimeout(() => {
      const defectCount = Math.random() < 0.3 ? 0 : 1 + Math.floor(Math.random() * 3);
      const defects = [];
      const annotations = [];
      for (let j = 0; j < defectCount; j++) {
        const d = MOCK_DEFECTS[Math.floor(Math.random() * MOCK_DEFECTS.length)];
        defects.push({ type: d.type, sev: d.sev, desc: d.desc });
        annotations.push({
          label: d.type,
          confidence: 0.7 + Math.random() * 0.28,
          coordinates: [10+Math.random()*60, 10+Math.random()*50, 15+Math.random()*40, 10+Math.random()*35]
        });
      }
      updateWfCard(card.id, {
        status: 'done',
        defects,
        annotations,
        details: defects.length ? defects.map(d => `${d.type}(${d.desc})`).join('；') : '未检测到明显缺陷'
      });
      idx++;
      processNext();
    }, delay);
  }
  processNext();
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function scrollDown() { const el = document.getElementById('msgScroll'); requestAnimationFrame(() => el.scrollTop = el.scrollHeight); }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 180) + 'px'; }

function handleFiles(files) {
  for (const f of files) { pendingFileList.push(f); if (f.type.startsWith('image/')) { const r = new FileReader(); r.onload = e => { pendingImages.push(e.target.result); renderImagePreview(); }; r.readAsDataURL(f); } else { renderImagePreview(); } }
  document.getElementById('fileInput').value = '';
}
function removeFile(i) {
  const old = pendingFileList.splice(i, 1)[0];
  if (old && old.type.startsWith('image/')) { pendingImages = []; Promise.all(pendingFileList.filter(f => f.type.startsWith('image/')).map(f => new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(f); }))).then(imgs => { pendingImages = imgs; renderImagePreview(); }); }
  renderImagePreview();
}
function renderImagePreview() {
  const area = document.getElementById('imagePreview');
  if (!pendingFileList.length) { area.innerHTML = ''; return; }
  let ii = 0;
  area.innerHTML = pendingFileList.map((f, i) => {
    if (f.type.startsWith('image/') && ii < pendingImages.length) { const src = pendingImages[ii++]; return `<div class="preview-item"><img src="${src}"><button class="rm-btn" onclick="removeFile(${i})">&times;</button></div>`; }
    let icon = '📄'; if (f.type.includes('pdf')||f.name.endsWith('.pdf')) icon='📕'; else if (f.type.includes('zip')||f.name.endsWith('.zip')) icon='📦'; else if (f.type.includes('sheet')||f.type.includes('excel')||f.name.match(/\.xlsx?$/i)) icon='📊'; else if (f.type.includes('word')||f.type.includes('document')||f.name.endsWith('.docx')) icon='📝'; else if (f.type.includes('csv')||f.name.endsWith('.csv')) icon='📋'; else if (f.type.includes('video')||f.name.match(/\.(mp4|avi|mov|mkv)$/i)) icon='🎬';
    const sz = f.size>1048576?(f.size/1048576).toFixed(1)+'MB':(f.size/1024).toFixed(0)+'KB';
    return `<div class="preview-item" style="display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-hover);font-size:10px;color:var(--text-muted);gap:2px;"><span style="font-size:22px">${icon}</span><span style="max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px">${escHtml(f.name)}</span><span style="font-size:10px">${sz}</span><button class="rm-btn" onclick="removeFile(${i})">&times;</button></div>`;
  }).join('');
}
</script>
</body>
</html>
