// ══════════════════════════════════════════════
// Workflow DAG 可视化 — Coze/Dify 风格的节点编排画板
// ══════════════════════════════════════════════

// 从 design_workflow 返回的 nodes 列表初始化 DAG
// nodes 格式: [{node_id, capability, action, depends_on: [node_id, ...]}]
function initWorkflowDag(nodes) {
  if (!Array.isArray(nodes) || !nodes.length) return;
  dagNodes = nodes.map(n => ({
    node_id: n.node_id,
    capability: n.capability || n.action || 'node',
    action: n.action,
    depends_on: Array.isArray(n.depends_on) ? n.depends_on : [],
  }));
  // 构建 edges（依赖关系：父 → 子）
  dagEdges = [];
  dagNodes.forEach(n => {
    (n.depends_on || []).forEach(parent => {
      dagEdges.push({ from: parent, to: n.node_id });
    });
  });
  // 初始化状态（全部 pending，第一个节点 running）
  dagNodeStates = {};
  dagNodes.forEach((n, i) => {
    dagNodeStates[n.node_id] = i === 0 ? 'running' : 'pending';
  });
  // 自动布局
  dagPositions = computeDagLayout(dagNodes, dagEdges);
  // 渲染
  renderDagGraph();
  openWfCanvas();
}

// 拓扑分层布局算法
// 把 DAG 节点按依赖关系分层：根节点在第 0 层，依赖第 N-1 层节点的在第 N 层
function computeDagLayout(nodes, edges) {
  const positions = {};
  if (!nodes.length) return positions;
  // 构建邻接表
  const inDegree = {}; // 入度
  const adj = {};      // 邻接（父→子列表）
  nodes.forEach(n => {
    inDegree[n.node_id] = 0;
    adj[n.node_id] = [];
  });
  edges.forEach(e => {
    if (adj[e.from] && inDegree[e.to] !== undefined) {
      adj[e.from].push(e.to);
      inDegree[e.to]++;
    }
  });
  // 拓扑分层（Kahn 算法变体 — 按层 BFS）
  const layers = []; // [[node_id, ...], [node_id, ...], ...]
  let remaining = new Set(nodes.map(n => n.node_id));
  while (remaining.size > 0) {
    // 找出当前所有入度为 0 的节点（在 remaining 中）
    const layer = [];
    for (const id of remaining) {
      // 入度 = 还在 remaining 中的父节点数
      const parents = edges.filter(e => e.to === id && remaining.has(e.from));
      if (parents.length === 0) layer.push(id);
    }
    if (!layer.length) {
      // 出现环 — 把剩余节点都塞进当前层避免死循环
      layer.push(...remaining);
    }
    layers.push(layer);
    layer.forEach(id => remaining.delete(id));
  }
  // 计算坐标 — 每层水平居中
  const nodeWidth = 180;
  const nodeHeight = 56;
  const layerGap = 240;  // 水平间距（节点宽 + gap）
  const nodeGap = 90;     // 垂直间距
  const padding = 40;
  // 计算每层最大高度，用于垂直居中
  layers.forEach((layer, layerIdx) => {
    const layerHeight = layer.length * (nodeHeight + nodeGap) - nodeGap;
    layer.forEach((nodeId, nodeIdx) => {
      positions[nodeId] = {
        x: padding + layerIdx * layerGap,
        y: padding + nodeIdx * (nodeHeight + nodeGap),
      };
    });
  });
  return positions;
}

// 渲染 DAG 到 SVG
function renderDagGraph() {
  const svg = document.getElementById('wfDagSvg');
  if (!svg) return;
  if (!dagNodes.length) { svg.innerHTML = ''; return; }
  const nodeWidth = 180;
  const nodeHeight = 56;
  // 计算 SVG 画布尺寸
  let maxX = 0, maxY = 0;
  Object.values(dagPositions).forEach(p => {
    if (p.x + nodeWidth > maxX) maxX = p.x + nodeWidth;
    if (p.y + nodeHeight > maxY) maxY = p.y + nodeHeight;
  });
  const svgWidth = Math.max(maxX + 40, 600);
  const svgHeight = Math.max(maxY + 40, 200);
  svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
  svg.setAttribute('width', svgWidth);
  svg.setAttribute('height', svgHeight);

  // 渲染连线（先画线后画节点，让节点压在线上）
  let edgesHtml = '';
  dagEdges.forEach(edge => {
    const from = dagPositions[edge.from];
    const to = dagPositions[edge.to];
    if (!from || !to) return;
    const x1 = from.x + nodeWidth;
    const y1 = from.y + nodeHeight / 2;
    const x2 = to.x;
    const y2 = to.y + nodeHeight / 2;
    // 贝塞尔曲线 — 水平方向控制点
    const dx = (x2 - x1) / 2;
    const path = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    const fromState = dagNodeStates[edge.from] || 'pending';
    const toState = dagNodeStates[edge.to] || 'pending';
    let edgeClass = 'dag-edge';
    if (fromState === 'done') edgeClass += ' done';
    else if (toState === 'running' || fromState === 'running') edgeClass += ' active';
    // 箭头（终点小三角）
    const arrowSize = 5;
    const arrowPath = `M ${x2} ${y2} l ${-arrowSize} ${-arrowSize/2} l 0 ${arrowSize} z`;
    edgesHtml += `<path class="${edgeClass}" d="${path}" />`;
    edgesHtml += `<path class="${edgeClass} dag-edge-arrow" d="${arrowPath}" />`;
  });

  // 渲染节点
  let nodesHtml = '';
  dagNodes.forEach(n => {
    const pos = dagPositions[n.node_id];
    if (!pos) return;
    const state = dagNodeStates[n.node_id] || 'pending';
    const statusIcon = {
      pending: '○',
      running: '◐',
      done: '✓',
      failed: '✗',
      cancelled: '⊘',
    }[state] || '○';
    const statusColor = {
      pending: 'var(--text-muted)',
      running: 'var(--accent)',
      done: 'var(--green)',
      failed: 'var(--red)',
      cancelled: 'var(--text-faint)',
    }[state] || 'var(--text-muted)';
    // 节点显示 capability + node_id（截断）
    const capLabel = (n.capability || 'node').slice(0, 14);
    const nodeLabel = n.node_id.slice(0, 16);
    nodesHtml += `<g class="dag-node ${state}" transform="translate(${pos.x}, ${pos.y})" data-node-id="${escHtml(n.node_id)}">
      <rect class="dag-node-rect" width="${nodeWidth}" height="${nodeHeight}" rx="10" ry="10" />
      <text class="dag-node-capability" x="14" y="20">${escHtml(capLabel)}</text>
      <text class="dag-node-label" x="14" y="40">${escHtml(nodeLabel)}</text>
      <text class="dag-node-status-icon" x="${nodeWidth - 20}" y="22" fill="${statusColor}" text-anchor="middle">${statusIcon}</text>
    </g>`;
  });

  svg.innerHTML = edgesHtml + nodesHtml;

  // 给每个节点绑定 hover tooltip
  svg.querySelectorAll('.dag-node').forEach(g => {
    const nodeId = g.dataset.nodeId;
    const node = dagNodes.find(n => n.node_id === nodeId);
    const state = dagNodeStates[nodeId] || 'pending';
    const execNode = execNodes.find(n => n.node_id === nodeId);
    g.addEventListener('mouseenter', (e) => {
      const tooltip = document.getElementById('dagTooltip');
      if (!tooltip || !node) return;
      const summary = execNode?.summary || '（暂无执行摘要）';
      tooltip.innerHTML = `<div class="dag-tooltip-title">${escHtml(nodeId)}</div><div class="dag-tooltip-body">capability: ${escHtml(node.capability)}<br>state: <span style="color:${statusColor}">${state}</span><br>${escHtml(summary)}</div>`;
      tooltip.classList.add('show');
    });
    g.addEventListener('mousemove', (e) => {
      const tooltip = document.getElementById('dagTooltip');
      if (!tooltip) return;
      const rect = document.getElementById('wfCanvasBody').getBoundingClientRect();
      const x = e.clientX - rect.left + 12;
      const y = e.clientY - rect.top + 12;
      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
    });
    g.addEventListener('mouseleave', () => {
      const tooltip = document.getElementById('dagTooltip');
      if (tooltip) tooltip.classList.remove('show');
    });
  });
}

function openWfCanvas() {
  document.getElementById('wfCanvas').classList.add('open');
}
function closeWfCanvas() {
  document.getElementById('wfCanvas').classList.remove('open');
}

// ── 实时通知和弹窗系统 ──
let notificationWs = null;
let activeNotifications = [];

function connectNotificationWs() {
  if (notificationWs) return;
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${window.location.host}${API_BASE}/notifications/ws`;
  notificationWs = new WebSocket(wsUrl);
  notificationWs.onopen = () => {
    console.log('Notification WebSocket connected');
    updateConnectionStatus(true);
  };
  notificationWs.onmessage = (event) => {
    try {
      const notification = JSON.parse(event.data);
      showNotificationPopup(notification);
    } catch (e) {
      console.error('Failed to parse notification:', e);
    }
  };
  notificationWs.onclose = () => {
    updateConnectionStatus(false);
    notificationWs = null;
    setTimeout(connectNotificationWs, 3000);
  };
  notificationWs.onerror = (error) => {
    console.error('Notification WebSocket error:', error);
  };
}

function updateConnectionStatus(connected) {
  const dot = document.getElementById('statusDot');
  if (connected) {
    dot.style.boxShadow = '0 0 10px var(--green), 0 0 20px var(--green)';
  } else {
    dot.style.boxShadow = '';
  }
}

function showNotificationPopup(notification) {
  if (activeNotifications.find(n => n.notification_id === notification.notification_id)) return;
  activeNotifications.push(notification);
  const popup = document.createElement('div');
  popup.className = 'notification-popup';
  popup.id = `notif-${notification.notification_id}`;
  const isConfirmation = notification.notification_type === 'confirmation_request';
  const isEscalation = notification.notification_type === 'escalation';
  const isWorkflowUpdate = notification.notification_type === 'workflow_update';
  let icon = '⚠️';
  let colorClass = 'warning';
  if (isEscalation) { icon = '🚨'; colorClass = 'danger'; }
  else if (isConfirmation) { icon = '❓'; colorClass = 'warning'; }
  else if (isWorkflowUpdate) { icon = '📋'; colorClass = 'info'; }

  const hasApprovalId = notification.payload && notification.payload.approval_id;
  const payloadOptions = notification.payload?.options || [];
  const isMultiOptionConfirm = isConfirmation && Array.isArray(payloadOptions) && payloadOptions.length >= 2;

  let actionsHtml = '';
  if (isMultiOptionConfirm && hasApprovalId) {
    const buttonsHtml = payloadOptions.map((opt, idx) => {
      const safeOpt = String(opt).replace(/'/g, "\\'");
      const btnClass = idx === 0 ? 'notif-btn-approve' : (idx === payloadOptions.length - 1 ? 'notif-btn-reject' : 'notif-btn-ack');
      return `<button class="notif-btn ${btnClass}" onclick="approveFromNotification('${notification.notification_id}', '${notification.payload.approval_id}', '${safeOpt}')">${escHtml(opt)}</button>`;
    }).join('\n          ');
    actionsHtml = `<div class="notification-actions notif-options-grid">${buttonsHtml}</div>`;
  } else if (isConfirmation || isEscalation) {
    const options = payloadOptions.length >= 2 ? payloadOptions : ['确认', '拒绝'];
    if (hasApprovalId) {
      actionsHtml = `<div class="notification-actions">
          <button class="notif-btn notif-btn-approve" onclick="approveFromNotification('${notification.notification_id}', '${notification.payload.approval_id}', 'approved')">${escHtml(options[0] || '确认')}</button>
          <button class="notif-btn notif-btn-reject" onclick="approveFromNotification('${notification.notification_id}', '${notification.payload.approval_id}', 'rejected')">${escHtml(options[1] || '拒绝')}</button>
        </div>`;
    } else {
      actionsHtml = `<div class="notification-actions">
          <button class="notif-btn notif-btn-approve" onclick="resolveNotification('${notification.notification_id}', 'approved')">${escHtml(options[0] || '确认')}</button>
          <button class="notif-btn notif-btn-reject" onclick="resolveNotification('${notification.notification_id}', 'rejected')">${escHtml(options[1] || '拒绝')}</button>
        </div>`;
    }
  } else {
    actionsHtml = `<div class="notification-actions"><button class="notif-btn notif-btn-ack" onclick="acknowledgeNotification('${notification.notification_id}')">知道了</button></div>`;
  }

  popup.innerHTML = `
    <div class="notification-icon ${colorClass}">${icon}</div>
    <div class="notification-content">
      <div class="notification-title">${escHtml(notification.title)}</div>
      <div class="notification-message">${escHtml(notification.message)}</div>
      ${actionsHtml}
    </div>
    <button class="notification-close" onclick="closeNotification('${notification.notification_id}')">&times;</button>
  `;
  popup.dataset.notificationId = notification.notification_id;
  if (hasApprovalId) popup.dataset.approvalId = notification.payload.approval_id;
  document.body.appendChild(popup);
  setTimeout(() => popup.classList.add('show'), 10);
  if (notification.expires_at) {
    const expiresAt = new Date(notification.expires_at);
    const now = new Date();
    const timeout = expiresAt.getTime() - now.getTime();
    if (timeout > 0) setTimeout(() => closeNotification(notification.notification_id), timeout);
  }
}

async function approveFromNotification(notificationId, approvalId, decision) {
  try {
    await fetch(`${API_BASE}/chat/approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approval_id: approvalId, decision: decision, feedback: '' })
    });
  } catch (e) {
    console.error('Failed to approve:', e);
  }
  closeNotification(notificationId);
}

async function acknowledgeNotification(notificationId) {
  try {
    await fetch(`${API_BASE}/notifications/${notificationId}/acknowledge`, { method: 'POST' });
  } catch (e) {
    console.error('Failed to acknowledge:', e);
  }
  closeNotification(notificationId);
}

async function resolveNotification(notificationId, decision) {
  try {
    await fetch(`${API_BASE}/notifications/${notificationId}/resolve?decision=${decision}`, { method: 'POST' });
  } catch (e) {
    console.error('Failed to resolve:', e);
  }
  closeNotification(notificationId);
}

function closeNotification(notificationId) {
  const popup = document.getElementById(`notif-${notificationId}`);
  if (popup) {
    popup.classList.remove('show');
    setTimeout(() => popup.remove(), 300);
  }
  activeNotifications = activeNotifications.filter(n => n.notification_id !== notificationId);
}
</script>
