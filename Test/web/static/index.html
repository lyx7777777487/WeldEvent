<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeldEvent — 智能标注工作流</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">W</span>
      <span class="brand-name">WeldEvent</span>
      <span class="brand-sub">智能标注工作流</span>
    </div>
    <div class="topbar-right">
      <div class="topbar-status" id="connStatus">
        <span class="dot dot-idle"></span>
        <span class="conn-text">未连接</span>
      </div>
    </div>
  </header>

  <!-- 主内容 -->
  <main class="main">

    <!-- Step 1: 数据准备 -->
    <section class="step" id="stepData">
      <div class="step-header">
        <div class="step-number">1</div>
        <div class="step-title">数据准备</div>
        <div class="step-desc">选择已有数据集，或创建新数据集并上传图片</div>
      </div>
      <div class="step-body">
        <div class="data-row">
          <div class="data-left">
            <label class="field-label">选择数据集</label>
            <select id="datasetSelect" class="field-input">
              <option value="">加载中...</option>
            </select>
            <div class="dataset-info" id="datasetInfo" hidden>
              <span id="datasetName" class="dataset-name"></span>
              <span id="datasetImageCount" class="dataset-meta"></span>
              <button id="deleteDatasetBtn" class="btn-icon btn-danger-sm" title="删除此数据集">×</button>
            </div>
            <!-- 查看图片列表 -->
            <div id="imageListArea" hidden>
              <label class="field-label" style="margin-top:10px">图片列表</label>
              <div id="imageList" class="image-list"></div>
            </div>
          </div>
          <div class="data-divider">或</div>
          <div class="data-right">
            <label class="field-label">新建数据集</label>
            <input id="newDatasetName" class="field-input" type="text" placeholder="输入数据集名称" />
            <div class="upload-area" id="uploadArea">
              <input type="file" id="fileInput" multiple accept="image/*" hidden />
              <div class="upload-placeholder">
                <div class="upload-icon">+</div>
                <div>点击或拖拽上传图片</div>
                <div class="upload-hint">支持 jpg / png / bmp，可多选</div>
              </div>
              <div class="upload-preview" id="uploadPreview" hidden></div>
            </div>
            <button id="createDatasetBtn" class="btn btn-secondary" disabled>创建并上传</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Step 2: 标注需求 -->
    <section class="step" id="stepRequirement">
      <div class="step-header">
        <div class="step-number">2</div>
        <div class="step-title">标注需求</div>
        <div class="step-desc">描述你想对图片做什么样的标注，LLM 会据此设计专业工作流</div>
      </div>
      <div class="step-body">
        <textarea id="requirementInput" class="field-input requirement-textarea" rows="3"
          placeholder="例如：对焊缝图像做气孔和裂纹检测，如果检出缺陷需要人工复审">对焊缝图像做气孔和裂纹检测，如果检出缺陷需要复审</textarea>
        <div class="requirement-tags">
          <span class="tag" data-text="检测焊缝中的气孔缺陷">气孔检测</span>
          <span class="tag" data-text="检测焊缝中的裂纹缺陷">裂纹检测</span>
          <span class="tag" data-text="对缺陷区域做分割标注">缺陷分割</span>
          <span class="tag" data-text="先 AI 预标注，不确定的转人工审核">AI+人工协作</span>
          <span class="tag" data-text="对焊缝外观质量做综合评级">质量评级</span>
        </div>
        <button id="designBtn" class="btn btn-primary" disabled>
          <span class="btn-text">让 LLM 设计工作流</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </div>
    </section>

    <!-- Step 3: 工作流设计 -->
    <section class="step step-collapsed" id="stepWorkflow">
      <div class="step-header">
        <div class="step-number">3</div>
        <div class="step-title">工作流设计</div>
        <div class="step-desc" id="workflowDesc">等待 LLM 设计...</div>
      </div>
      <div class="step-body" hidden>
        <div id="workflowContent" class="workflow-content"></div>
        <div class="workflow-actions">
          <button id="executeBtn" class="btn btn-primary">执行工作流</button>
          <button id="redesignBtn" class="btn btn-ghost">重新设计</button>
        </div>
      </div>
    </section>

    <!-- Step 4: 执行与进度 -->
    <section class="step step-collapsed" id="stepResult">
      <div class="step-header">
        <div class="step-number">4</div>
        <div class="step-title">执行与进度</div>
        <div class="step-desc" id="resultDesc">等待执行...</div>
      </div>
      <div class="step-body" hidden>
        <!-- 执行结果 -->
        <div id="resultContent" class="result-content"></div>

        <!-- 作业/任务管理面板 -->
        <div id="jobTaskPanel" hidden>
          <div class="panel-section">
            <div class="panel-section-title">作业管理</div>
            <div class="panel-section-body">
              <div class="action-row">
                <button id="listJobsBtn" class="btn btn-sm btn-secondary">查看作业列表</button>
                <button id="refreshJobBtn" class="btn btn-sm btn-ghost">刷新作业状态</button>
              </div>
              <div id="jobList" class="item-list"></div>
            </div>
          </div>

          <div class="panel-section">
            <div class="panel-section-title">任务管理</div>
            <div class="panel-section-body">
              <div class="action-row">
                <button id="listAllTasksBtn" class="btn btn-sm btn-secondary">查看所有任务</button>
                <button id="createTaskBtn" class="btn btn-sm btn-secondary">新建任务</button>
              </div>
              <div id="taskList" class="item-list"></div>
            </div>
          </div>

          <div class="panel-section">
            <div class="panel-section-title">Agent 控制</div>
            <div class="panel-section-body">
              <div class="action-row">
                <button id="agentStartTaskBtn" class="btn btn-sm btn-secondary">Agent 启动任务</button>
                <button id="agentReportBtn" class="btn btn-sm btn-secondary">汇报进度</button>
                <button id="agentRequestHumanBtn" class="btn btn-sm btn-secondary">请求人工审核</button>
                <button id="agentConfirmHumanBtn" class="btn btn-sm btn-secondary">确认人工审核</button>
              </div>
              <div id="agentLog" class="agent-log"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- MCP 调用日志面板（底部抽屉） -->
  <div class="mcp-drawer" id="mcpDrawer">
    <div class="mcp-drawer-header" id="mcpDrawerHeader">
      <div class="mcp-drawer-title">
        <span class="mcp-drawer-icon">MCP</span>
        <span>MCP 调用日志</span>
        <span class="mcp-drawer-count" id="mcpLogCount" hidden>0</span>
      </div>
      <div class="mcp-drawer-status" id="mcpStreamStatus">
        <span class="dot dot-idle"></span>
        <span class="mcp-status-text">未连接</span>
      </div>
      <div class="mcp-drawer-actions">
        <button class="btn-icon" id="mcpClearBtn" title="清空日志">清空</button>
        <button class="mcp-drawer-toggle" id="mcpDrawerToggle">展开</button>
      </div>
    </div>
    <div class="mcp-drawer-body" id="mcpDrawerBody" hidden>
      <div class="mcp-log-list" id="mcpLogList">
        <div class="mcp-log-empty">等待 MCP 调用...</div>
      </div>
    </div>
  </div>

  <!-- LLM 汇报浮层 -->
  <div class="llm-report" id="llmReport" hidden>
    <div class="llm-report-header">
      <span class="llm-report-icon">AI</span>
      <span class="llm-report-title">LLM 汇报</span>
      <button class="llm-report-close" id="llmReportClose">&times;</button>
    </div>
    <div class="llm-report-body" id="llmReportBody"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
