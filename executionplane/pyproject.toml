[project]
name = "executionplane"
version = "0.1.0"
description = "Execution Plane — Agent Pool for Industrial Agent OS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
cv = [
    "opencv-python>=4.9",
    "scipy>=1.11",
]
vision = [
    "openai>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["executionplane*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
